<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC Control · Sign in</title>
<style>
  :root { --bg:#0e1116; --card:#171b22; --text:#e8eaed; --muted:#8b93a1; --accent:#4f8cff; --bad:#ff5d5d; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg);
         color:var(--text); font:16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding:16px; }
  form { background:var(--card); padding:28px; border-radius:16px; width:100%; max-width:340px; }
  h1 { margin:0 0 4px; font-size:22px; }
  p { margin:0 0 20px; color:var(--muted); font-size:14px; }
  input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid #2a303b; background:#0e1116;
          color:var(--text); font-size:16px; }
  button { width:100%; margin-top:12px; padding:12px; border:0; border-radius:10px; background:var(--accent);
           color:#fff; font-size:16px; font-weight:600; cursor:pointer; }
  .err { color:var(--bad); margin-top:12px; font-size:14px; }
</style>
</head>
<body>
<form method="post">
  <h1>🖥️ PC Control</h1>
  <p>Enter your dashboard password.</p>
  <input type="password" name="password" placeholder="Password" autofocus autocomplete="current-password">
  <button type="submit">Sign in</button>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
</form>
</body>
</html>
