# Netlify settings for the Sync Studio website (the app lives in /sync-studio).
# Netlify detects Next.js and adds its official adapter automatically.
[build]
  base = "sync-studio"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
