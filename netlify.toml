# Netlify settings for the Sync Studio website (the app lives in /sync-studio).
# Used when the project's Base directory is empty in Netlify.
[build]
  base = "sync-studio"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify's official Next.js adapter (turns the build into pages, functions and edge middleware)
[[plugins]]
  package = "@netlify/plugin-nextjs"
