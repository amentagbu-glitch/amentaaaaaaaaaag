<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brochures — Taskalart</title>
<meta name="description" content="Digital brochures and flipbooks by Taskalart.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Montserrat,system-ui,sans-serif;background:#0e0f12;color:#eceef2;min-height:100vh;display:flex;flex-direction:column}
  header{padding:56px 24px 28px;max-width:1100px;margin:0 auto;width:100%}
  .eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#9aa0ab;font-weight:600}
  h1{font-size:clamp(30px,5vw,48px);font-weight:800;margin-top:10px;letter-spacing:-.01em}
  header p{margin-top:10px;color:#a9aeb8;font-size:15px;max-width:560px;line-height:1.6}
  main{flex:1;max-width:1100px;margin:0 auto;width:100%;padding:8px 24px 48px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:28px}
  .card{display:block;text-decoration:none;color:inherit}
  .cover{aspect-ratio:1/1;border-radius:6px;overflow:hidden;background:#1b1d22;
    box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 40px -18px rgba(0,0,0,.8);transition:transform .25s,box-shadow .25s;position:relative}
  .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.25),transparent 6%)}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .card:hover .cover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 26px 50px -18px rgba(0,0,0,.9)}
  .meta{margin-top:12px}
  .meta h2{font-size:15px;font-weight:700}
  .meta span{font-size:12.5px;color:#9aa0ab}
  footer{text-align:center;font-size:12px;color:#8a909b;padding:20px}
  footer a{color:#eceef2;font-weight:700;text-decoration:none}
  footer a:hover{text-decoration:underline}
</style>
</head>
<body>
<header>
  <div class="eyebrow">Digital library</div>
  <h1>Brochures</h1>
  <p>Interactive flipbooks by Taskalart. If you received a link to a brochure, open it directly.</p>
</header>
<main><div class="grid" id="grid"></div></main>
<footer>© <span id="y"></span> · Powered by <a href="https://taskalart.ma" target="_blank" rel="noopener">Taskalart</a></footer>
<script>
  // On a client's own domain, the home address opens their brochure directly.
  if (/uniquegroupholding/i.test(location.hostname)) location.replace('/ugh/');
  // To add a brochure: put its folder next to /ugh and add one line here.
  // Kept private: each client only gets their own link.
  const BOOKS = [];
  const g = document.getElementById('grid');
  BOOKS.forEach(b => {
    g.insertAdjacentHTML('beforeend',
      `<a class="card" href="/${b.slug}/"><div class="cover"><img src="/${b.slug}/cover.jpg" alt="${b.title}" loading="lazy"></div>
       <div class="meta"><h2>${b.title}</h2><span>${b.sub}</span></div></a>`);
  });
  document.getElementById('y').textContent = new Date().getFullYear();
</script>
</body>
</html>
