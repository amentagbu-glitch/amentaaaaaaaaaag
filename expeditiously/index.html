<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expeditiously Trans — Company Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<script src="page-flip.browser.js"></script>
<style>
  :root{--g1:#0a1c3a;--g2:#13294f;--acc:#ed1c28;--txt:#eef2f8}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Montserrat,system-ui,sans-serif;color:var(--txt);
    background:radial-gradient(ellipse at 50% 35%,#1d3766 0%,var(--g1) 60%,#050f22 100%);
    display:flex;flex-direction:column;overflow:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;gap:12px}
  .back{color:var(--txt);text-decoration:none;font-size:12px;font-weight:600;opacity:.8;padding:6px 10px;border:1px solid rgba(255,255,255,.2);border-radius:999px;white-space:nowrap}
  .back:hover{background:var(--acc);color:var(--g1);opacity:1}
  .tagline{font-size:12px;opacity:.75;margin-left:auto}
  .social{display:flex;gap:8px;margin-left:14px}
  .tagline + .social{margin-left:18px}
  .social a{display:flex;align-items:center;gap:7px;color:var(--txt);text-decoration:none;font-size:12px;font-weight:600;
    padding:7px 12px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(255,255,255,.06);transition:.2s}
  .social a:hover{background:var(--acc);color:var(--g1);border-color:var(--acc)}
  .social svg{width:16px;height:16px;flex:none;position:relative;z-index:1}
  .social a span{position:relative;z-index:1}
  .social a{position:relative;overflow:hidden;isolation:isolate}
  .social a::after{content:"";position:absolute;top:-20%;bottom:-20%;left:-60%;width:45%;z-index:0;pointer-events:none;
    background:linear-gradient(105deg,transparent 0%,rgba(255,255,255,.55) 50%,transparent 100%);
    transform:skewX(-20deg) translateX(0);animation:sweep 3.6s ease-in-out infinite}
  .social a:nth-child(2)::after{animation-delay:.25s}
  .social a:nth-child(3)::after{animation-delay:.5s}
  @keyframes sweep{0%,55%{left:-60%}85%,100%{left:130%}}
  .social a.wa:hover{background:#25d366;border-color:#25d366;color:#fff}
  h1.brand{line-height:0}
  h1.brand img{height:34px;width:auto;display:block}
  @media (max-width:700px){h1.brand img{height:26px}}
  header h1{font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  header h1 span{color:var(--acc)}
  .stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:6px 14px;position:relative;overflow:hidden;z-index:1}
  #book{margin:0 auto;flex:none;filter:drop-shadow(0 22px 34px rgba(0,0,0,.45))}
  .bar,.thumbs,footer,header{position:relative;z-index:3}
  .page{background:#fff;overflow:hidden}
  .page img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
  .side{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;
    border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:#fff;font-size:22px;cursor:pointer;z-index:5;
    display:flex;align-items:center;justify-content:center;transition:background .2s}
  .side:hover{background:var(--acc);color:var(--g1)}
  #prev{left:12px}#next{right:12px}
  .bar{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px 4px;flex-wrap:wrap}
  .bar button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:var(--txt);
    font:600 13px Montserrat,sans-serif;padding:8px 13px;border-radius:999px;cursor:pointer;transition:background .2s}
  .bar button:hover{background:var(--acc);color:var(--g1)}
  #count{font-size:13px;font-weight:600;min-width:92px;text-align:center;opacity:.9}
  .thumbs{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;scrollbar-width:thin}
  .thumbs img{height:46px;width:69px;object-fit:cover;border-radius:3px;cursor:pointer;opacity:.55;border:2px solid transparent;flex:none;transition:.2s}
  .thumbs img.on{opacity:1;border-color:var(--acc)}
  footer{text-align:center;font-size:11.5px;padding:6px 10px 12px;opacity:.85;letter-spacing:.03em}
  footer b{color:var(--acc);font-weight:700}
  footer a{text-decoration:none}footer a:hover b{text-decoration:underline}
  #zoom{position:fixed;inset:0;background:rgba(5,20,9,.96);z-index:50;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
  #zoom.open{display:block}
  #zoom img{display:block;width:min(1600px,94vw);max-width:none;margin:12px auto}
  @media (max-width:700px){#zoom img{width:180vw;margin:0 auto}}
  #zclose{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:51;background:var(--acc);color:var(--g1);border:0;
    font:700 14px Montserrat,sans-serif;padding:9px 15px;border-radius:999px;cursor:pointer;display:none}
  #zoom.open + #zclose{display:block}
  #loading{position:absolute;font-size:13px;opacity:.7}
  body.focus header, body.focus .thumbs, body.focus footer{display:none}
  body.focus{background:
      radial-gradient(60% 55% at 50% 46%, rgba(237,28,40,.22) 0%, rgba(237,28,40,0) 70%),
      radial-gradient(120% 70% at 50% 115%, #1f7a36 0%, rgba(31,122,54,0) 60%),
      radial-gradient(90% 60% at 50% -15%, #134a23 0%, rgba(19,74,35,0) 65%),
      linear-gradient(180deg,#0a2412 0%,#061a0c 55%,#041208 100%)}
  body.focus::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
    background-image:radial-gradient(rgba(255,255,255,.07) 1px, transparent 1.2px);background-size:22px 22px;
    -webkit-mask-image:radial-gradient(70% 65% at 50% 50%, transparent 35%, #000 100%);mask-image:radial-gradient(70% 65% at 50% 50%, transparent 35%, #000 100%)}
  body.focus::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;box-shadow:inset 0 0 180px rgba(0,0,0,.65)}
  body.focus #book{filter:drop-shadow(0 30px 50px rgba(0,0,0,.6)) drop-shadow(0 0 60px rgba(237,28,40,.12))}
  body.focus .stage{padding:18px 14px 6px}
  body.focus .bar{padding:6px 8px calc(12px + env(safe-area-inset-bottom))}
  body.focus .bar button{background:rgba(255,255,255,.06);backdrop-filter:blur(6px)}
  @media (max-width:900px){.tagline{display:none}.tagline + .social{margin-left:auto}}
  @media (max-width:520px){.social a span{display:none}.social a{padding:8px}.social{gap:6px}}
  @media (max-width:700px){.side{display:none}header h1{font-size:13px}.thumbs img{height:40px;width:60px}}
  /* ---- Loader ---- */
  #loader{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
    background:radial-gradient(70% 60% at 50% 45%,#ffffff 0%,#f3f5f9 55%,#e3e8f1 100%);
    transition:clip-path 1s cubic-bezier(.75,0,.2,1), opacity .4s ease .7s;clip-path:inset(0 0 0 0)}
  #loader.done{clip-path:inset(0 0 100% 0);opacity:0;pointer-events:none}
  #loader::before{content:"";position:absolute;width:520px;height:520px;max-width:120vw;max-height:120vw;border-radius:50%;
    background:radial-gradient(circle,rgba(237,28,40,.18),transparent 65%);animation:pulse 3s ease-in-out infinite}
  .lg-box{position:relative;width:min(380px,74vw)}
  #loaderLogo{display:block;width:100%;height:auto;clip-path:inset(0 100% 0 0);
    animation:wipe 1.1s cubic-bezier(.65,0,.25,1) .2s forwards, breathe 3.2s ease-in-out 1.6s infinite}
  .lg-leaf{position:absolute;left:20%;top:-12%;width:12%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle,rgba(237,28,40,.55),transparent 70%);opacity:0;animation:spark 1.2s ease 1.1s forwards}
  .lg-track{position:relative;width:min(240px,56vw);height:4px;border-radius:3px;background:rgba(10,28,58,.12);overflow:hidden;
    opacity:0;animation:fadeUp .6s ease .9s forwards}
  .lg-bar{position:absolute;inset:0;width:0;background:linear-gradient(90deg,#0a1c3a,#ed1c28);border-radius:3px}
  .lg-pct{position:relative;font-size:15px;font-weight:700;letter-spacing:.12em;color:#0a1c3a;margin-top:-20px;opacity:0;animation:fadeUp .6s ease 1s forwards}
  .avo-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:.2}
  .avo{position:absolute;left:-16%;will-change:transform;animation:fall linear infinite}
  .avo svg{display:block;width:100%;height:auto;animation:spin ease-in-out infinite alternate}
  @keyframes fall{to{transform:translateX(135vw)}}
  @keyframes spin{from{transform:rotate(var(--r0))}to{transform:rotate(var(--r1))}}
  .lg-box,.lg-track,.lg-pct{z-index:1}
  .lg-pct{font-variant-numeric:tabular-nums}
  @keyframes wipe{to{clip-path:inset(0 0 0 0)}}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
  @keyframes spark{0%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.6)}100%{opacity:0;transform:scale(2.4)}}
  @keyframes pulse{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.08);opacity:1}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  body.reveal #book{animation:bookIn 1s cubic-bezier(.2,.8,.2,1) both}
  @keyframes bookIn{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
  /* ---- Intro video ---- */
  #intro{position:fixed;inset:0;z-index:90;background:#000;display:none;align-items:center;justify-content:center;transition:opacity .8s ease}
  #intro.on{display:flex}
  #intro.out{opacity:0;pointer-events:none}
  #introVid{width:100%;height:100%;object-fit:contain;background:#000}
  #intro{background:#06132b}
  #ambWrap{position:absolute;inset:0;overflow:hidden;display:none;z-index:0}
  #ambWrap iframe{position:absolute;left:50%;top:50%;width:max(100vw,177.78vh);height:max(100vh,56.25vw);border:0;
    transform:translate(-50%,-50%) scale(1.25);filter:blur(48px) saturate(1.5) brightness(.85);opacity:.85;pointer-events:none}
  #ambTint{position:absolute;inset:0;z-index:0;display:none;pointer-events:none;
    background:radial-gradient(75% 70% at 50% 50%, rgba(19,41,79,.25) 0%, rgba(19,41,79,.6) 60%, rgba(3,10,26,.9) 100%),
               linear-gradient(180deg, rgba(237,28,40,.18), rgba(19,41,79,.45))}
  #intro.yt #ambWrap,#intro.yt #ambTint{display:block}
  #ytWrap{position:absolute;inset:0;display:none}
  #ytWrap iframe{width:100%;height:100%;border:0}
  #intro.yt{flex-direction:column;justify-content:space-evenly;padding:calc(10px + env(safe-area-inset-top)) 0 calc(86px + env(safe-area-inset-bottom))}
  #intro.yt #ytWrap{inset:auto;position:relative;z-index:1;flex:none;width:min(92vw,calc((100dvh - 340px) * 16 / 9));aspect-ratio:16/9;
    border-radius:16px;overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08);background:#000}
  @media (max-width:700px){#intro.yt #ytWrap{width:94vw;border-radius:12px}}
  #ytShield{position:absolute;inset:0;z-index:2;display:none}
  #intro.yt #introVid{display:none} #intro.yt #ytWrap,#intro.yt #ytShield{display:block}
  .iv-btn{position:absolute;z-index:2;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.45);color:#fff;
    font:600 14px Montserrat,sans-serif;padding:10px 18px;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .iv-btn:hover{background:#ed1c28;color:#0a1c3a;border-color:#ed1c28}
  #ivLogo{position:relative;z-index:3;flex:none;height:72px;width:auto;max-width:86vw;object-fit:contain;
    filter:drop-shadow(0 4px 14px rgba(0,0,0,.45));opacity:0;animation:fadeUp .8s ease .4s forwards}
  #ivTitle{position:relative;z-index:3;flex:none;margin:0;padding:0 22px;max-width:900px;text-align:center;color:#fff;
    font:700 26px/1.35 Montserrat,sans-serif;letter-spacing:.01em;text-wrap:balance;text-shadow:0 3px 14px rgba(0,0,0,.45);
    opacity:0;animation:fadeUp .8s ease .9s forwards}
  #ivTitle .g{color:#ed1c28}
  #intro:not(.yt) #ivLogo,#intro:not(.yt) #ivTitle{display:none}
  @media (max-width:700px){#ivLogo{height:58px}#ivTitle{font-size:19px}
    #intro .iv-btn{font-size:12.5px;padding:9px 13px}#ivSkip{right:14px}#ivSnd{left:14px}}
  #ivSkip{right:18px;bottom:calc(22px + env(safe-area-inset-bottom))}
  #ivSnd.hint{background:#ed1c28;color:#0a1c3a;border-color:#ed1c28;animation:sndPulse 1.6s ease-in-out infinite}
  @keyframes sndPulse{0%,100%{box-shadow:0 0 0 0 rgba(237,28,40,.6)}50%{box-shadow:0 0 0 10px rgba(237,28,40,0)}}
  #ivSnd{left:18px;bottom:calc(22px + env(safe-area-inset-bottom));padding:10px 14px}
  #intro.needtap #ytShield{display:none}
  #ivBar{position:absolute;left:0;bottom:0;height:3px;width:0;background:#ed1c28;z-index:2}
  /* ---- End popup ---- */
  #endPop{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;
    background:rgba(3,10,26,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .4s ease}
  #endPop.show{opacity:1;pointer-events:auto}
  .ep-card{position:relative;width:min(420px,100%);background:radial-gradient(120% 90% at 50% 0%,#ffffff 0%,#f2f5fa 70%,#e6ebf3 100%);
    border-radius:22px;padding:34px 26px 24px;text-align:center;color:#0a1c3a;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);
    transform:translateY(24px) scale(.94);transition:transform .55s cubic-bezier(.2,.9,.25,1.15)}
  #endPop.show .ep-card{transform:none}
  .ep-card img{width:min(250px,70%);height:auto;display:block;margin:0 auto 18px}
  .ep-card h2{font-size:19px;font-weight:700;margin-bottom:6px}
  .ep-card p{font-size:13.5px;line-height:1.55;color:#3d4b63;margin-bottom:20px}
  .ep-links{display:flex;flex-direction:column;gap:10px}
  .ep-links a{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;font:600 14px Montserrat,sans-serif;
    padding:13px 16px;border-radius:12px;transition:transform .15s, box-shadow .2s}
  .ep-links a:hover{transform:translateY(-2px);box-shadow:0 10px 20px -10px rgba(0,0,0,.4)}
  .ep-links svg{width:18px;height:18px;flex:none}
  .ep-web{background:#0a1c3a;color:#fff}
  .ep-li{background:#ed1c28;color:#fff}
  .ep-wa{background:#25d366;color:#fff}
  .ep-again{margin-top:14px;background:none;border:0;color:#0a1c3a;font:600 13px Montserrat,sans-serif;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .ep-x{position:absolute;top:10px;right:12px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(10,28,58,.08);color:#0a1c3a;font-size:18px;cursor:pointer}
  .ep-x:hover{background:rgba(10,28,58,.16)}
  /* ---- Floating WhatsApp ---- */
  #waFloat{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));z-index:70;
    display:flex;align-items:center;gap:10px;text-decoration:none;opacity:0;transform:translateY(16px);transition:opacity .5s,transform .5s}
  body.reveal #waFloat{opacity:1;transform:none;transition-delay:1.2s}
  .wf-btn{position:relative;width:60px;height:60px;border-radius:50%;background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 24px -6px rgba(0,0,0,.45);transition:transform .2s}
  .wf-btn::before{content:"";position:absolute;inset:0;border-radius:50%;background:#25d366;z-index:-1;animation:waPulse 2.4s ease-out infinite}
  .wf-btn svg{width:34px;height:34px}
  .wf-label{background:#25d366;color:#fff;font:500 14px Montserrat,sans-serif;padding:7px 14px;border-radius:10px;white-space:nowrap;
    box-shadow:0 6px 16px -6px rgba(0,0,0,.4)}
  #waFloat:hover .wf-btn{transform:scale(1.08)}
  @keyframes waPulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.6);opacity:0}}
  .thumbs{padding-right:220px}
  @media (max-width:700px){
    .thumbs{padding-right:76px}
    body.reveal .wf-label{animation:labelOut .5s ease 6s forwards}
  }
  @keyframes labelOut{to{opacity:0;transform:translateX(10px);visibility:hidden}}
  @media (max-width:700px){.wf-btn{width:54px;height:54px}.wf-btn svg{width:30px;height:30px}.wf-label{font-size:13px;padding:6px 12px}}
</style>
</head>

    sndBtn.textContent = muted ? '🔇 Sound' : '🔊 Sound';
  };

  // progress: real loading, shown as a smooth 0 → 100 count
  const PRE = 6, t0 = Date.now(), MIN = 3000, MAX = 12000;
  let loaded = 0, shown = 0, finished = false;
  const bar = document.getElementById('lgBar'), pct = document.getElementById('lgPct');
  function tick(){
    const real = finished ? 1 : (loaded / PRE) * (videoSettled ? 1 : 0.9);
    const timeCap = Math.min(1, (Date.now() - t0) / MIN);        // never faster than MIN
    const target = Math.min(real, timeCap) * 100;
    shown += Math.max(0, target - shown) * 0.12 + (shown < target ? 0.25 : 0);
    if (shown > target) shown = target;
    bar.style.width = shown + '%'; pct.textContent = Math.floor(shown) + '%';
    if (shown >= 99.9 && real >= 1) { pct.textContent = '100%'; return reveal(); }
    requestAnimationFrame(tick);
  }
  let revealed = false;
  function reveal(){
    if (revealed) return; revealed = true;
    setTimeout(() => {
      build();
      if (videoOK) { playIntro(); }
      else { intro.classList.remove('on'); document.body.classList.add('reveal'); }
      document.getElementById('loader').classList.add('done');
      setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 1300);
    }, 300);
  }
  for (let i = 1; i <= PRE; i++) {
    const im = new Image();
    im.onload = im.onerror = () => { loaded++; };
    im.src = src(i);
  }
  setTimeout(() => { finished = true; }, MAX);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
