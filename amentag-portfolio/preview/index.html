<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oussama Amentag Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Oussama Amentag — filmmaker, video mapping artist, designer and app developer based in Agadir, Morocco.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Inter:wght@400;500;600&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE occasion: a filmmaker's showreel site, confident and cinematic, calm enough to let the work lead
   IDEA a camera viewfinder and an edit timeline: REC dot, timecode, frame guides, film strip, clips on tracks
   PICTURE the portrait inside a live viewfinder with a projection-mapping grid sweeping light across it
   COLOUR night #0f0f11 / paper #f4f1ea, ink, REC red #ff3b2f as the accent, mapping cyan #5fd6f0 as support
   TYPE Big Shoulders Display (cinema title cards) + Inter; Cairo for Arabic
   LAYOUT laptop: giant two-line name across the top, viewfinder overlapping on the right, intro and buttons bottom-left; phone: name, viewfinder, intro, buttons */
:root{color-scheme:light dark;--bg:light-dark(#f4f1ea,#0f0f11);--bg2:light-dark(#ebe6dc,#17171a);--card:light-dark(#fffdf8,#1c1c20);--ink:light-dark(#121214,#f2efe8);--mute:light-dark(#5b5853,#a3a09a);--line:light-dark(#d8d2c6,#2c2c31);--rec:#ff3b2f;--map:light-dark(#0e8aa6,#5fd6f0);--chip:#efebe3}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,"Cairo",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
html[dir=rtl] body{font-family:"Cairo",Inter,system-ui,sans-serif}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
h1,h2,h3{font-family:"Big Shoulders Display","Cairo",Impact,sans-serif;font-weight:900;line-height:1.02;letter-spacing:-.01em;margin:0}
h2{font-size:clamp(34px,5vw,56px)}
h3{font-size:24px;font-weight:700;letter-spacing:0}
p{margin:0 0 1em}
.wrap{max-width:1240px;margin:0 auto}
.band{padding-block:clamp(40px,6vw,88px);padding-left:max(5vw,16px,env(safe-area-inset-left,0px));padding-right:max(5vw,16px,env(safe-area-inset-right,0px))}
.alt{background:var(--bg2)}
.lead{font-size:clamp(17px,1.6vw,19px);color:var(--mute);max-width:60ch}
.mute{color:var(--mute)}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:600;text-decoration:none;border:1.5px solid var(--ink);background:none;color:var(--ink);font-size:15px;cursor:pointer;transition:background .2s,color .2s}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.rec{background:var(--rec);border-color:var(--rec);color:#fff}
.btn.rec:hover{background:#e22c21;border-color:#e22c21;color:#fff}
.btn:focus-visible,a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--map);outline-offset:3px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--rec);display:inline-block;flex:none}
.live .dot{animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;min-height:64px;padding-left:max(5vw,16px,env(safe-area-inset-left,0px));padding-right:max(5vw,16px,env(safe-area-inset-right,0px));max-width:1340px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-family:"Big Shoulders Display",sans-serif;font-weight:900;font-size:24px;text-decoration:none;letter-spacing:.01em}
nav.main{display:flex;gap:4px;margin-inline-start:auto}
nav.main a{padding:8px 12px;border-radius:999px;text-decoration:none;font-size:15px;font-weight:500;color:var(--mute)}
nav.main a:hover,nav.main a[aria-current=page]{color:var(--ink);background:var(--bg2)}
.tools{display:flex;gap:6px}
.ib{min-width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);font:600 13px Inter,sans-serif;cursor:pointer;display:grid;place-items:center;padding:0 10px}
.ib:hover{border-color:var(--ink)}
#menu{display:none}
@media(max-width:900px){nav.main{position:fixed;inset:calc(64px + env(safe-area-inset-top,0px)) 0 auto;flex-direction:column;background:var(--bg);border-bottom:1px solid var(--line);padding:12px max(5vw,16px) 20px;display:none}nav.main.open{display:flex}nav.main a{font-size:18px;padding:12px}#menu{display:grid}.tools{margin-inline-start:auto}}
/* hero */
.hero{position:relative;overflow:hidden;padding-top:clamp(28px,5vw,64px)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr);grid-template-areas:"name vf" "intro vf";column-gap:clamp(24px,4vw,56px)}
.hero h1{grid-area:name;font-size:clamp(64px,11.5vw,168px);line-height:.86;letter-spacing:-.015em;text-transform:uppercase;position:relative;z-index:2;align-self:end}
.role{display:flex;align-items:center;gap:12px;font-family:"Big Shoulders Display",sans-serif;font-weight:700;font-size:clamp(24px,2.6vw,34px);margin:22px 0 14px}
.role b{color:var(--rec);font-weight:700}
.intro{grid-area:intro;align-self:start}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.avail{display:flex;align-items:center;gap:10px;margin-top:22px;font-size:14px;color:var(--mute)}
.vf{grid-area:vf;position:relative;align-self:center;aspect-ratio:4/5;max-height:640px;width:100%;border-radius:6px;overflow:hidden;background:#0b0b0c;color:#f2efe8}
.vf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:contrast(1.05)}
.vf svg{position:absolute;inset:0;width:100%;height:100%}
.sweep{position:absolute;inset:-20% -60%;background:linear-gradient(100deg,transparent 42%,rgba(95,214,240,.28) 50%,transparent 58%);mix-blend-mode:screen;animation:sweep 6s ease-in-out infinite;pointer-events:none}
@keyframes sweep{0%{transform:translateX(-40%)}60%,100%{transform:translateX(40%)}}
.hud{position:absolute;inset:14px;display:flex;flex-direction:column;justify-content:space-between;font:600 13px/1 Inter,sans-serif;letter-spacing:.04em;text-shadow:0 1px 2px #000;pointer-events:none}
.hud div{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hud .r{display:flex;align-items:center;gap:8px}
.tc{font-variant-numeric:tabular-nums}
@media(max-width:820px){.hero .wrap{grid-template-columns:minmax(0,1fr);grid-template-areas:"name" "vf" "intro"}.hero h1{font-size:clamp(56px,17vw,120px);margin-bottom:22px}.vf{aspect-ratio:4/4.3;max-height:480px}}
/* logos */
.logos{overflow:hidden;padding-block:28px;border-block:1px solid var(--line)}
.logos p{text-align:center;font-size:14px;color:var(--mute);margin-bottom:18px}
.track{display:flex;gap:14px;width:max-content;animation:roll 60s linear infinite}
.logos:hover .track{animation-play-state:paused}
@keyframes roll{to{transform:translateX(-50%)}}
html[dir=rtl] .track{animation-name:rollr}
@keyframes rollr{to{transform:translateX(50%)}}
.chip{flex:none;width:150px;height:76px;border-radius:10px;background:var(--chip);display:grid;place-items:center;padding:12px 16px}
.chip img{max-height:52px;width:auto;max-width:118px;object-fit:contain;filter:grayscale(1);opacity:.8;transition:filter .3s,opacity .3s}
.chip img.k{filter:brightness(0);opacity:.75}
.chip:hover img{filter:none;opacity:1}
/* sections */
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px 32px;margin-bottom:clamp(24px,3vw,40px)}
.head .lead{margin:0}
.disc{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line)}
.disc a{display:block;padding:22px 20px 26px 0;text-decoration:none;border-bottom:1px solid var(--line)}
.disc a+a{padding-inline-start:20px;border-inline-start:1px solid var(--line)}
.disc h3{margin:10px 0 8px;font-size:26px}
.disc p{color:var(--mute);font-size:15px;margin:0}
.disc .n{color:var(--rec);font:700 14px Inter,sans-serif;font-variant-numeric:tabular-nums}
.disc a:hover h3{color:var(--rec)}
@media(max-width:1000px){.disc{grid-template-columns:repeat(2,minmax(0,1fr))}.disc a,.disc a+a{padding:20px 16px 22px 0;border-inline-start:0}.disc a:nth-child(even){padding-inline-start:16px;border-inline-start:1px solid var(--line)}}
@media(max-width:560px){.disc{grid-template-columns:minmax(0,1fr)}.disc a:nth-child(even){padding-inline-start:0;border-inline-start:0}}
/* film strip works */
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{min-height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);font:500 15px Inter,sans-serif;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:22px}
.frame{display:block;text-decoration:none;background:#0b0b0c;color:#f2efe8;border-radius:6px;padding:20px 14px;position:relative}
.frame::before,.frame::after{content:"";position:absolute;left:14px;right:14px;height:8px;background:repeating-linear-gradient(90deg,#3a3a40 0 12px,transparent 12px 24px);border-radius:2px}
.frame::before{top:6px}
.frame::after{bottom:6px}
.frame .pic{aspect-ratio:16/9;overflow:hidden;border-radius:3px;position:relative}
.frame .pic img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.frame:hover .pic img{transform:scale(1.04)}
.frame .meta{padding:16px 6px 8px;display:flex;justify-content:space-between;align-items:end;gap:16px}
.frame h3{font-size:30px;color:#fff}
.frame .sub{font-size:14px;color:#b7b3ac;margin-top:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid currentColor;opacity:.85;text-decoration:none}
.frame .go{flex:none;width:44px;height:44px;border-radius:50%;background:var(--rec);display:grid;place-items:center;color:#fff;font-size:20px}
html[dir=rtl] .frame .go{transform:scaleX(-1)}
/* quotes */
.quotes{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px;scrollbar-width:thin}
.q{flex:0 0 min(360px,84%);margin:0;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:16px}
.q blockquote{margin:0;font-size:17px;line-height:1.55}
.q .who{margin-top:auto;display:flex;gap:12px;align-items:center;font-size:14px}
.q .who b{display:block;font-size:15px}
.q .av{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;flex:none;font-size:13px}
.stars{color:var(--rec);letter-spacing:2px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(10em,1fr));gap:24px;margin-top:clamp(36px,5vw,64px);border-top:1px solid var(--line);padding-top:28px}
.stats b{display:block;font:900 clamp(56px,7vw,88px)/1 "Big Shoulders Display",sans-serif}
.stats span{color:var(--mute)}
/* cta + footer */
.cta{background:var(--rec);color:#fff;margin-inline:calc(-1*max(5vw,16px));padding:clamp(40px,6vw,80px) max(5vw,16px);display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px 48px;align-items:end}
.cta h2{font-size:clamp(48px,8vw,112px);text-transform:uppercase;line-height:.88}
.cta p{font-size:18px;max-width:46ch}
.cta .btn{border-color:#fff;color:#fff}
.cta .btn:hover{background:#fff;color:var(--rec)}
.cta .btn.solid{background:#fff;color:#111;border-color:#fff}
@media(max-width:820px){.cta{grid-template-columns:minmax(0,1fr)}}
footer{border-top:1px solid var(--line)}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px 32px;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute)}
.soc{display:flex;flex-wrap:wrap;gap:8px}
.soc a{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink)}
.soc a:hover{border-color:var(--ink)}
.soc svg{width:16px;height:16px;fill:currentColor}
.wa{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:#25d366;display:grid;place-items:center;z-index:15;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.wa svg{width:28px;height:28px;fill:#fff}
html[dir=rtl] .wa{right:auto;left:calc(18px + env(safe-area-inset-left,0px))}
/* pages */
.ph{padding-block:clamp(36px,5vw,72px) clamp(24px,3vw,40px)}
.ph h1{font-size:clamp(52px,9vw,120px);text-transform:uppercase;line-height:.9}
.ph .lead{margin-top:18px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:clamp(28px,5vw,72px);align-items:start}
@media(max-width:820px){.split{grid-template-columns:minmax(0,1fr)}}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:20px}
.facts div{background:var(--card);padding:14px 16px;font-size:15px}
.facts small{display:block;color:var(--mute);font-size:13px}
.prose{font-size:17px;max-width:68ch}
.prose h2{font-size:clamp(30px,3.6vw,40px);margin:40px 0 14px}
.prose h2:first-child{margin-top:0}
.list{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.list li{padding-inline-start:20px;position:relative}
.list li::before{content:"";position:absolute;inset-inline-start:0;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--rec)}
.pills{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0}
.pills li{padding:6px 14px;border-radius:999px;background:var(--bg2);font-size:14px;font-weight:500}
.sticky{position:sticky;top:calc(88px + env(safe-area-inset-top,0px))}
/* timeline */
.tlw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#0b0b0c;color:#e9e6df;margin-bottom:40px}
.tl{min-width:780px;padding:18px 18px 22px;position:relative}
.tl .ruler{display:grid;grid-template-columns:120px repeat(10,minmax(0,1fr));font:600 12.5px Inter,sans-serif;color:#8d8a84;font-variant-numeric:tabular-nums;margin-bottom:10px}
.tl .ruler span{border-inline-start:1px solid #2b2b30;padding-inline-start:6px}
.tl .ruler span:first-child{border:0}
.trk{display:grid;grid-template-columns:120px minmax(0,1fr);align-items:center;margin-bottom:8px}
.trk .nm{font:600 13px Inter,sans-serif;color:#b7b3ac}
.lane{position:relative;height:46px;background:#16161a;border-radius:4px}
.clip{position:absolute;top:4px;bottom:4px;border-radius:4px;padding:4px 8px;font:600 12.5px/1.25 Inter,sans-serif;color:#111;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:1px solid rgba(0,0,0,.25)}
.clip small{display:block;font-weight:500;opacity:.75;font-size:11.5px}
.c1{background:#ff8a80}.c2{background:#ffd9a0}.c3{background:#8fe3f5}
.ph-line{position:absolute;top:44px;bottom:16px;width:2px;background:var(--rec)}
.ph-line::before{content:"Now";position:absolute;top:-4px;left:6px;font:700 12px Inter,sans-serif;color:var(--rec)}
.jobs{display:grid;gap:0;border-top:1px solid var(--line)}
.job{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 28px;padding:20px 0;border-bottom:1px solid var(--line)}
.job .yr{font-weight:600;color:var(--rec);font-variant-numeric:tabular-nums;white-space:nowrap}
.job h3{font-size:24px}
.job p{margin:6px 0 0;color:var(--mute)}
@media(max-width:600px){.job{grid-template-columns:minmax(0,1fr)}}
.skills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;margin-top:48px}
@media(max-width:900px){.skills{grid-template-columns:repeat(2,minmax(0,1fr))}}
.skills h3{margin-bottom:12px}
/* project page */
.crumbs{font-size:14px;color:var(--mute);margin-bottom:16px}
.crumbs a{text-decoration:none}
.cover{aspect-ratio:21/9;border-radius:6px;overflow:hidden;background:#111;margin-top:28px}
.cover img{width:100%;height:100%;object-fit:cover}
@media(max-width:600px){.cover{aspect-ratio:4/3}}
.vids{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.vid{position:relative;display:block;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#000;text-decoration:none;color:#fff;border:0;padding:0;width:100%;cursor:pointer}
.vid img{width:100%;height:100%;object-fit:cover;opacity:.6;transition:opacity .3s}
.vid:hover img{opacity:.8}
.vid span{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:10px;font:600 15px Inter,sans-serif}
.vid i{width:64px;height:64px;border-radius:50%;background:var(--rec);display:grid;place-items:center;font-style:normal;font-size:22px}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.gal{columns:3 260px;column-gap:12px}
.gal button{display:block;width:100%;margin:0 0 12px;padding:0;border:0;border-radius:4px;overflow:hidden;cursor:zoom-in;background:var(--bg2);break-inside:avoid}
.gal img{width:100%;transition:transform .5s}
.gal button:hover img{transform:scale(1.03)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(5,5,6,.94);display:grid;place-items:center;padding:max(4vw,16px)}
.lb img{max-height:86vh;max-width:100%;width:auto;border-radius:4px}
.lb button{position:absolute;color:#fff;background:rgba(255,255,255,.1);border:0;width:48px;height:48px;border-radius:50%;font-size:22px;cursor:pointer}
.lb .x{top:calc(16px + env(safe-area-inset-top,0px));right:16px}
.lb .p{left:16px;top:50%}
.lb .n{right:16px;top:50%}
.pnav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:40px}
.pnav a{display:block;padding:18px 20px;border:1px solid var(--line);border-radius:10px;text-decoration:none}
.pnav a:hover{border-color:var(--ink)}
.pnav small{color:var(--mute);display:block}
.pnav b{font:700 22px "Big Shoulders Display",sans-serif}
.pnav .nx{text-align:end}
/* contact */
.ways{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:8px}
@media(max-width:820px){.ways{grid-template-columns:minmax(0,1fr)}}
.way{display:block;padding:22px;border-radius:10px;background:var(--card);border:1px solid var(--line);text-decoration:none}
.way:hover{border-color:var(--rec)}
.way small{color:var(--mute);display:block;font-size:14px}
.way b{font-size:18px;overflow-wrap:anywhere}
.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;counter-reset:s}
@media(max-width:900px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.steps{grid-template-columns:minmax(0,1fr)}}
.steps li{counter-increment:s;border-top:2px solid var(--ink);padding-top:14px}
.steps li::before{content:"Take " counter(s);display:block;color:var(--rec);font-weight:700;font-size:14px;margin-bottom:6px}
.steps b{display:block;font:700 24px "Big Shoulders Display",sans-serif;margin-bottom:6px}
.steps p{color:var(--mute);margin:0;font-size:15px}
details{border-bottom:1px solid var(--line);padding:16px 0}
details:first-of-type{border-top:1px solid var(--line)}
summary{cursor:pointer;font-weight:600;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::after{content:"+";font-size:22px;line-height:1;color:var(--rec)}
details[open] summary::after{content:"−"}
details p{margin:12px 0 0;color:var(--mute)}
form{display:grid;gap:14px}
label{display:grid;gap:6px;font-size:14px;font-weight:600}
input,textarea{font:16px Inter,sans-serif;padding:13px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
input:focus,textarea:focus{outline:2px solid var(--map);border-color:transparent}
textarea{min-height:140px;resize:vertical}

    <p style="font-size:20px">For close to a decade I’ve worked behind cameras and inside editing timelines, from my first on-site editing job to leading editing and graphics for production studios. Today I move between telling stories on screen and building the visuals and tools that carry them.</p>

    <h2>How I work</h2><p>Filmmaking taught me story, rhythm and emotion. Building software taught me systems and precision. The work I’m proudest of needs both.</p><p>A mapping show has to run flawlessly on a schedule in front of a live audience. An app has to feel as considered as it functions. A film has to hold someone’s attention in the first five seconds. Different crafts, same discipline — understand the constraint, then make something that feels effortless inside it.</p>
    <h2>Who I work with</h2><p>I’ve collaborated with production houses, agencies and public institutions — among them Lumazic, Soufiane Production, Digital Photo Tafraout, Montrichard Group, the city of Agadir and the province of Sidi Ifni — on work ranging from cultural events and weddings to campaigns for international watch brands.</p>

    <div class="ctas"><a class="btn rec" href="#contact">Get in touch</a><a class="btn" href="#resume">See my full resume</a></div>
  </div>
</div></section>${cta()}`;

    ${[['What’s your typical turnaround time?','It depends on the scope — a short edit can turn around in days, while a full mapping show or app needs weeks. Tell me your deadline up front and I’ll say clearly whether it’s realistic.'],['Do you work with clients outside Morocco?','Yes. Editing, design and app development happen remotely regardless of where you are. Filming, photography and on-site mapping installations are based around Agadir and Morocco, with travel possible for the right project.'],['Can I hire you for just one part of a project — say, only the editing?','Absolutely. Most of what I do works standalone: editing only, design only, a single mapping show, or a full production from concept to delivery.'],['How does pricing work?','It’s scope-based, not a flat rate — send me the details of your project and I’ll come back with a clear quote before anything starts.'],['What do you need from me to get started?','A description of the project, your timeline, and any references or examples of what you like. The more context up front, the faster we can move.']].map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}
  </div>
</div></section>`;

V.post=p=>{
 const i=POSTS.indexOf(p), pr=POSTS[i+1], nx=POSTS[i-1];
 return `
<section class="band ph" style="padding-bottom:0"><div class="wrap">
  <div class="crumbs"><a href="#works">${t('works')}</a> / ${p.labels.map(l=>`<a href="#works" data-go="${l}">${l}</a>`).join(', ')}</div>

  <p class="lead">${esc(p.intro)}</p><p class="mute" style="font-size:14px">${p.date}</p>
  <div class="cover">${img(p.cover,p.title,1280,720,1)}</div>
</div></section>
<section class="band"><div class="wrap split">
  <div class="sticky"><h3 style="margin-bottom:10px">Tools</h3><ul class="pills">${p.tools.map(x=>`<li>${x}</li>`).join('')}</ul><h3 style="margin:24px 0 10px">Labels</h3><div class="tags">${p.labels.map(l=>`<a class="tag" href="#works" data-go="${l}">${l}</a>`).join('')}</div></div>
  <div class="prose"><h2>The brief</h2><p>${esc(p.brief)}</p><h2>What I did</h2><p>${esc(p.did)}</p></div>
</div></section>
<section class="band alt"><div class="wrap"><div class="head"><h2>${p.videos.length>1?'Video highlights':'The film'}</h2></div>
  <div class="vids">${p.videos.map(v=>v.drive?`<button class="vid" data-drive="${v.drive}">${img(v.poster,v.label,1100,733)}<span><i>▶</i>${v.label}</span></button>`:`<a class="vid" href="${v.href}" target="_blank" rel="noopener">${img(v.poster,v.label,1280,720)}<span><i>▶</i>${v.label}</span></a>`).join('')}</div>
</div></section>
<section class="band"><div class="wrap"><div class="head"><h2>Gallery</h2><span class="mute">${p.gallery.length} photos</span></div>
  <div class="gal">${p.gallery.map((g,k)=>`<button data-k="${k}" aria-label="Open photo ${k+1}">${img(g,p.title+' photo '+(k+1),1100,733)}</button>`).join('')}</div>
  ${p.cta?`<div class="ctas"><a class="btn rec" href="#contact">${p.cta}</a></div>`:''}
  <div class="pnav">${pr?`<a href="#work-${pr.slug}"><small>← ${t('prev')}</small><b>${esc(pr.title)}</b></a>`:'<span></span>'}${nx?`<a class="nx" href="#work-${nx.slug}"><small>${t('next')} →</small><b>${esc(nx.title)}</b></a>`:''}</div>
</div></section>${cta()}`};

const app=document.getElementById('app');
let pendingFilter='All', roleTimer, tcRaf;

function applyFilter(f){
  pendingFilter=f; let n=0;
  document.querySelectorAll('#grid .frame').forEach(el=>{const show=f==='All'||el.dataset.labels.split(' ').includes(f);el.hidden=!show;if(show)n++});
  document.querySelectorAll('.filters button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===f));
  const c=document.getElementById('count'); if(c) c.textContent=n+(n===1?' project':' projects');
}

function mesh(){
  const g=document.getElementById('mesh'); if(!g) return;
  let s=7, r=()=>(s=s*16807%2147483647)/2147483647, pts=[], out='';
  for(let y=0;y<=5;y++)for(let x=0;x<=4;x++)pts.push([x*100+(x%4?(r()-.5)*40:0),y*100+(y%5?(r()-.5)*40:0)]);
  const P=(x,y)=>pts[y*5+x];
  for(let y=0;y<5;y++)for(let x=0;x<4;x++){const a=P(x,y),b=P(x+1,y),c=P(x,y+1),d=P(x+1,y+1);out+=`<path d="M${a}L${b}L${d}L${c}Z M${a}L${d}"/>`}
  g.innerHTML=out;
}

function render(){
  clearInterval(roleTimer); cancelAnimationFrame(tcRaf);
  const h=(location.hash||'#home').slice(1);
  const post=h.startsWith('work-')&&POSTS.find(p=>'work-'+p.slug===h);
  const view=post?'post':(V[h]?h:'home');
  app.innerHTML=`<div data-view="${view}">${post?V.post(post):V[view](pendingFilter)}</div>`;
  document.querySelectorAll('nav.main a').forEach(a=>a.getAttribute('href')==='#'+(post?'works':view)?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  document.title=(post?post.title:view==='home'?'Oussama Amentag':t(view))+(view==='home'?' — Filmmaker & Creative Technologist':' · Oussama Amentag');
  if(document.getElementById('grid')) applyFilter(view==='home'?'All':pendingFilter);
  if(view==='home') startHero();
  if(post) bindPost(post);
  if(view==='contact') bindForm();
  document.getElementById('nav').classList.remove('open');
  window.scrollTo(0,0);
}

function startHero(){
  mesh();
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let i=0; const el=document.getElementById('role');
  if(!still) roleTimer=setInterval(()=>{i=(i+1)%ROLES.length; if(el) el.textContent=ROLES[i]},2600);
  const tc=document.getElementById('tc'), t0=performance.now(); let last=-1;
  const tick=now=>{const f=Math.floor((now-t0)/40); if(f!==last&&tc){last=f;const p=n=>String(n).padStart(2,'0');tc.textContent=`${p(Math.floor(f/90000)%24)}:${p(Math.floor(f/1500)%60)}:${p(Math.floor(f/25)%60)}:${p(f%25)}`} tcRaf=requestAnimationFrame(tick)};
  if(!still) tcRaf=requestAnimationFrame(tick);
}

function bindPost(p){
  document.querySelectorAll('.vid[data-drive]').forEach(b=>b.addEventListener('click',()=>{
    const url='https://drive.google.com/file/d/'+b.dataset.drive;
    if(CAN_EMBED){b.innerHTML=`<iframe src="${url}/preview" allow="autoplay; fullscreen" allowfullscreen title="Video"></iframe>`}
    else{const a=document.createElement('a');a.href=url+'/view';a.target='_blank';a.rel='noopener';a.click()}
  }));
  document.querySelectorAll('.gal button').forEach(b=>b.addEventListener('click',()=>lightbox(p.gallery,+b.dataset.k,b)));
}

function lightbox(list,k,opener){
  const d=document.createElement('div'); d.className='lb'; d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true');
  const show=()=>{d.innerHTML=`<img src="${list[k]}" alt="Photo ${k+1} of ${list.length}"><button class="x" aria-label="Close">✕</button><button class="p" aria-label="Previous">‹</button><button class="n" aria-label="Next">›</button>`};
  const close=()=>{d.remove();document.removeEventListener('keydown',key);opener&&opener.focus()};
  const key=e=>{if(e.key==='Escape')close();if(e.key==='ArrowRight'){k=(k+1)%list.length;show()}if(e.key==='ArrowLeft'){k=(k-1+list.length)%list.length;show()}};
  d.addEventListener('click',e=>{const c=e.target.className;if(c==='x'||e.target===d)close();else if(c==='n'){k=(k+1)%list.length;show()}else if(c==='p'){k=(k-1+list.length)%list.length;show()}});
  document.addEventListener('keydown',key); show(); document.body.appendChild(d); d.querySelector('.x').focus();
}

function bindForm(){
  const f=document.getElementById('cf'), out=document.getElementById('cf-out');
  f.addEventListener('submit',e=>{e.preventDefault();
    const n=f.name.value.trim(), m=f.message.value.trim(), em=f.email.value.trim();
    const href=`mailto:${EMAIL}?subject=${encodeURIComponent('Project enquiry from '+n)}&body=${encodeURIComponent(m+'\n\n— '+n+' ('+em+')')}`;
    const a=document.createElement('a'); a.href=href; a.click();
    out.hidden=false; out.textContent=`Your email app should open with this message ready to send. If it didn’t, write to ${EMAIL}.`;
  });
}

document.addEventListener('click',e=>{
  const f=e.target.closest('[data-f]'); if(f){applyFilter(f.dataset.f);return}
  const g=e.target.closest('[data-go]'); if(g){pendingFilter=g.dataset.go; if(location.hash==='#works'){e.preventDefault();render()}}
});

document.getElementById('soc').innerHTML=`<a href="mailto:${EMAIL}">${icons.mail}${EMAIL}</a><a href="tel:${TEL}">${icons.ph}${PHONE}</a><a href="${LINKEDIN}" target="_blank" rel="noopener">${icons.in}LinkedIn</a>`;

const root=document.documentElement;
function setLang(l){lang=l;root.lang=l;root.dir=l==='ar'?'rtl':'ltr';document.getElementById('lang').textContent=l.toUpperCase();document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));try{localStorage.setItem('oa-lang',l)}catch(e){}render()}
document.getElementById('lang').addEventListener('click',()=>setLang({en:'fr',fr:'ar',ar:'en'}[lang]));
document.getElementById('theme').addEventListener('click',()=>{const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;root.dataset.theme=dark?'light':'dark'});
const menu=document.getElementById('menu');
menu.addEventListener('click',()=>{const o=document.getElementById('nav').classList.toggle('open');menu.setAttribute('aria-expanded',o)});
window.addEventListener('hashchange',render);
setLang(lang);
}
</script>
