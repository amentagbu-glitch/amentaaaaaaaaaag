<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio Template T5</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Oussama Amentag — filmmaker, video mapping artist, designer and app developer based in Agadir, Morocco.">
<meta name="theme-color" content="#0f0f11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE work-tool precision with a filmmaker's taste: the visitor opens Oussama's own edit suite
   IDEA a non-linear editor (Premiere / Resolve): program monitor, media pool, inspector, timeline with tracks, markers and a playhead
   PICTURE the edit page itself: a monitor playing the showreel above a draggable timeline (V2 titles, V1 clips, A1 waveform, client markers)
   COLOUR app greys #0f0f11 / #18181b, ink #ececee; clip colours by label: Film blue, Photography gold, Projects green; playhead terracotta #e2562c
   TYPE Inter Tight for the interface, Instrument Serif for title cards, JetBrains Mono for timecode only; Cairo for Arabic
   LAYOUT laptop: one screen of panels, media pool left, monitor centre, inspector right, timeline across the bottom; phone: monitor, transport, timeline, inspector, media pool stacked, tabs at the bottom */
:root{color-scheme:dark;--bg:#0f0f11;--p1:#18181b;--p2:#202024;--p3:#2a2a2f;--line:#2e2e34;--ink:#ececee;--mute:#8d8d96;--acc:#e2562c;--film:#4f86c6;--photo:#c99a3a;--proj:#5fa37a;--aud:#3e8a5a;--sand:#c9bfae;--g:max(4vw,16px)}
*{box-sizing:border-box;min-width:0}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Inter Tight","Cairo",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
html[dir=rtl] body{font-family:"Cairo","Inter Tight",system-ui,sans-serif}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:"Instrument Serif","Cairo",Georgia,serif;font-weight:400;line-height:1;letter-spacing:-.01em;margin:0}
p{margin:0 0 1em}
.tc{font:500 13px "JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.mute{color:var(--mute)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:6px;border:1px solid var(--line);background:var(--p2);color:var(--ink);font-weight:600;font-size:14px;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--p3)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.acc:hover{filter:brightness(1.08)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:3px 9px;border-radius:4px;background:var(--p3);color:var(--ink);text-decoration:none}
.chip::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c,var(--mute))}
.c-Film{--c:var(--film)}.c-Photography{--c:var(--photo)}.c-Projects{--c:var(--proj)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.panel{background:var(--p1);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px;padding:0 12px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--mute);background:var(--p1)}
.ph b{color:var(--ink);font-weight:600}
.pb{padding:14px;overflow:auto}
/* title bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--p1);z-index:40}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--p1);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;height:52px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
.brand i{width:22px;height:22px;border-radius:5px;background:var(--acc);display:grid;place-items:center;font:700 11px "Inter Tight",sans-serif;font-style:normal;color:#fff}
.brand span{color:var(--mute);font-weight:500}
nav.tabs{display:flex;gap:2px;margin-inline:auto;background:var(--bg);padding:3px;border-radius:8px;border:1px solid var(--line)}
nav.tabs a{padding:6px 14px;border-radius:6px;text-decoration:none;font-size:13.5px;font-weight:500;color:var(--mute);white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current=page]{background:var(--p3);color:var(--ink)}
.tools{display:flex;gap:6px;align-items:center}
.ib{height:34px;min-width:34px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:var(--p2);cursor:pointer;font-size:12.5px;font-weight:600}
.rec{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--acc);display:inline-block;flex:none}
.blink{animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
@media(max-width:900px){nav.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;border-radius:0;border-width:1px 0 0;background:var(--p1);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:35}nav.tabs a{padding:8px 6px;font-size:12.5px}.brand span,.rec{display:none}.tools{margin-inline-start:auto}body{padding-bottom:60px}}
/* edit workspace */
.ws{display:grid;gap:8px;padding:8px max(8px,env(safe-area-inset-left,0px)) 8px max(8px,env(safe-area-inset-right,0px));grid-template-columns:250px minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"bin view insp" "tl tl tl";height:calc(100svh - 52px - env(safe-area-inset-top,0px));min-height:660px;max-height:1000px}
.ws>.bin{grid-area:bin}.ws>.view{grid-area:view}.ws>.insp{grid-area:insp}.ws>.tlp{grid-area:tl}
@media(max-width:1180px){.ws{grid-template-columns:220px minmax(0,1fr);grid-template-areas:"view view" "tl tl" "bin insp";height:auto;max-height:none}}
@media(max-width:700px){.ws{grid-template-columns:minmax(0,1fr);grid-template-areas:"view" "tl" "insp" "bin"}}
.view .stage{flex:1;display:grid;place-items:center;padding:12px;background:#0a0a0b;min-height:0}
.mon{position:relative;width:100%;max-width:min(100%,calc((100svh - 52px - 300px - 120px) * 16 / 9));aspect-ratio:16/9;background:#000;overflow:hidden;container-type:inline-size}
@media(max-width:1180px){.mon{max-width:100%}}
.mon>img,.mon .pt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pt{position:absolute;inset:0;background:#000}
.pt .look{position:absolute;inset:0 0 0 auto;width:44%}
.pt .look img{opacity:0;object-position:50% 30%}
.pt .look img.on{opacity:1}
.pt .look::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000,transparent 40%)}
html[dir=rtl] .pt .look{inset:0 auto 0 0}
.card{position:absolute;left:6%;top:50%;transform:translateY(-50%);max-width:56%}
.card h1{font-size:clamp(34px,9cqi,96px);line-height:.9}
.card p{margin:12px 0 0;color:var(--sand);font-size:clamp(13px,1.9cqi,18px)}
.card .role{color:var(--ink)}
.lower{position:absolute;left:5%;bottom:9%;max-width:70%;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.lower b{display:block;font:400 clamp(24px,5.4cqi,54px)/1 "Instrument Serif",serif}
.lower span{font-size:clamp(12px,1.6cqi,15px);color:#ddd}
.sub{position:absolute;left:8%;right:8%;bottom:5%;text-align:center;font-size:clamp(13px,2.1cqi,19px);line-height:1.35;background:rgba(0,0,0,.72);padding:6px 12px;border-radius:3px;justify-self:center}
.sub small{display:block;color:var(--sand);font-size:.8em;margin-top:2px}
.safe{position:absolute;inset:5%;border:1px dashed rgba(255,255,255,.18);pointer-events:none}
.safe::before{content:"";position:absolute;inset:5.5%;border:1px dashed rgba(255,255,255,.1)}
.mhud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;letter-spacing:.04em;color:#fff;text-shadow:0 1px 2px #000;pointer-events:none}
.trans{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.trans button{width:38px;height:38px;border-radius:6px;border:1px solid var(--line);background:var(--p2);cursor:pointer;display:grid;place-items:center}
.trans button.pl{width:46px;background:var(--ink);color:#111;border-color:var(--ink)}
.trans svg{width:16px;height:16px;fill:currentColor}
.trans .tc{min-width:110px;text-align:center}
.trans .kb{font-size:12px;color:var(--mute);margin-inline-start:8px}
@media(max-width:700px){.trans .kb{display:none}}
/* media pool */
.bins{display:flex;flex-wrap:wrap;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line)}
.bins button{border:0;background:none;padding:5px 9px;border-radius:5px;cursor:pointer;font-size:12.5px;color:var(--mute);display:flex;align-items:center;gap:6px}
.bins button::before{content:"";width:12px;height:9px;border:1.5px solid currentColor;border-radius:2px}
.bins button[aria-pressed=true]{background:var(--p3);color:var(--ink)}
.clips{list-style:none;margin:0;padding:6px;display:grid;gap:2px;overflow:auto}
.clip{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center;padding:6px;border-radius:6px;cursor:pointer;border:1px solid transparent;width:100%;background:none;text-align:start}
.clip:hover{background:var(--p2)}
.clip.cur{border-color:var(--acc);background:var(--p2)}
.clip img{width:64px;height:36px;object-fit:cover;border-radius:3px;border-bottom:3px solid var(--c,var(--mute))}
.clip b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip span{font-size:12px;color:var(--mute)}
/* inspector */
.insp .pb{display:grid;gap:14px;align-content:start}
.insp h2{font-size:32px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13px;margin:0}
.kv dt{color:var(--mute)}
.kv dd{margin:0}
.insp .sum{color:#cfcfd6;font-size:14px;margin:0}
/* timeline */
.tlp .ph .tc{color:var(--ink)}
.tlx{position:relative;direction:ltr;user-select:none;-webkit-user-select:none;touch-action:pan-y;padding:0 12px 10px}
.trow{display:grid;grid-template-columns:52px minmax(0,1fr);align-items:center;gap:0}
.thd{font:600 11.5px "Inter Tight",sans-serif;color:var(--mute);height:100%;display:flex;align-items:center;border-inline-end:1px solid var(--line);padding-inline-start:4px}
.lane{position:relative;height:34px;border-bottom:1px solid #222227;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/36 - 1px),rgba(255,255,255,.025) calc(100%/36 - 1px) calc(100%/36))}
.ruler .lane{height:26px;background:none;border-bottom:1px solid var(--line)}
.tick{position:absolute;top:0;bottom:0;border-inline-start:1px solid #3a3a41}
.tick span{position:absolute;top:4px;left:5px;font:500 10.5px "JetBrains Mono",monospace;color:var(--mute);white-space:nowrap}
.tick.s{top:16px}
@media(max-width:700px){.tick.h span{display:none}}
.cl{position:absolute;top:3px;bottom:3px;border-radius:4px;background:var(--c);color:#fff;font-size:11.5px;font-weight:600;padding:3px 7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;border:1px solid rgba(0,0,0,.35);display:flex;align-items:center;gap:4px}
.cl.title{--c:#6b6458}
.cl.portrait{--c:#5a5a66}
.cl img{height:100%;width:auto;border-radius:2px;opacity:.85}
.fx{position:absolute;inset:0;display:flex;gap:1px;opacity:.55;pointer-events:none}
.fx img{flex:1;min-width:0;height:100%;object-fit:cover}
.cl .nm{position:relative;z-index:1;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.wave{position:absolute;inset:3px 0;width:100%;height:calc(100% - 6px)}
.mk{position:absolute;top:4px;width:14px;height:18px;margin-left:-7px;background:var(--photo);clip-path:polygon(0 0,100% 0,100% 65%,50% 100%,0 65%);cursor:pointer;border:0;padding:0}
.mk:hover,.mk.on{background:#fff}
.phd{position:absolute;top:0;bottom:10px;width:0;pointer-events:none;z-index:3}
.phd::before{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;background:var(--acc)}
.phd::after{content:"";position:absolute;top:0;left:-7px;width:14px;height:14px;background:var(--acc);clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%)}
.lanes{position:relative;cursor:ew-resize}
/* below-the-fold bands */
.band{padding-block:clamp(40px,6vw,88px);padding-left:max(var(--g),env(safe-area-inset-left,0px));padding-right:max(var(--g),env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin:0 auto}
.hd{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px 32px;margin-bottom:24px}
.hd h2{font-size:clamp(40px,5.4vw,72px)}
.hd p{margin:0;color:var(--mute);max-width:52ch}
.fxlib{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media(max-width:1000px){.fxlib{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.fxlib{grid-template-columns:minmax(0,1fr)}}
.fxc{background:var(--p1);border:1px solid var(--line);border-radius:8px;padding:16px;text-decoration:none;display:flex;flex-direction:column;gap:8px}
.fxc:hover{border-color:var(--mute)}
.fxc .ico{width:36px;height:36px;border-radius:7px;background:var(--c);display:grid;place-items:center}
.fxc .ico svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.8}
.fxc h3{font-size:28px;margin-top:6px}
.fxc p{margin:0;color:var(--mute);font-size:14px}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:8px}
.note{background:var(--p1);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px;margin:0}
.note .tc{color:var(--photo)}
.note blockquote{margin:0;font-size:16px;line-height:1.5}
.note figcaption{margin-top:auto;font-size:13px;color:var(--mute)}
.note figcaption b{color:var(--ink);display:block;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(10em,1fr));gap:8px;margin-top:8px}
.stats div{background:var(--p1);border:1px solid var(--line);border-radius:8px;padding:18px}
.stats b{display:block;font:400 clamp(48px,5vw,72px)/1 "Instrument Serif",serif}
.stats span{color:var(--mute);font-size:13.5px}
.logos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.logo{height:78px;border-radius:8px;background:#e9e6e0;display:grid;place-items:center;padding:10px 14px}
.logo img{max-height:50px;width:auto;max-width:110px;object-fit:contain;filter:grayscale(1);opacity:.8}
.logo img.k{filter:brightness(0);opacity:.72}
.logo:hover img{filter:none;opacity:1}
.export{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px 48px;align-items:center;background:var(--p1);border:1px solid var(--line);border-radius:10px;padding:clamp(24px,4vw,48px)}
.export h2{font-size:clamp(44px,6.4vw,92px)}
.export h2 span{color:var(--acc)}
@media(max-width:820px){.export{grid-template-columns:minmax(0,1fr)}}
.bar2{height:6px;border-radius:3px;background:var(--p3);overflow:hidden;margin:14px 0 8px}
.bar2 i{display:block;height:100%;width:72%;background:var(--acc)}
footer{border-top:1px solid var(--line)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;font-size:13px;color:var(--mute)}
footer nav{display:flex;flex-wrap:wrap;gap:6px 18px}
footer a{text-decoration:none}
footer a:hover{color:var(--ink)}
/* inner pages */
.pg{padding:16px max(8px,env(safe-area-inset-left,0px)) 40px max(8px,env(safe-area-inset-right,0px))}
.pgh{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px 32px;padding:clamp(20px,4vw,48px) clamp(8px,2vw,24px) clamp(18px,3vw,32px)}
.pgh h1{font-size:clamp(56px,9vw,128px);line-height:.9}
.pgh p{margin:0;color:var(--mute);max-width:56ch;font-size:16px}
.two{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:8px;align-items:start}
@media(max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
.stick{position:sticky;top:calc(60px + env(safe-area-inset-top,0px))}
.prose{max-width:70ch;font-size:16px}
.prose h2{font-size:clamp(32px,3.4vw,44px);margin:36px 0 12px}
.prose h2:first-child{margin-top:0}
.prose p,.prose li{color:#d3d3d9}
.prose ul{padding-inline-start:18px;margin:0;display:grid;gap:10px}
.prose li b{color:var(--ink)}
.pills{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:0}
.pills li{padding:4px 10px;border-radius:4px;background:var(--p3);font-size:13px}
.ptr{aspect-ratio:4/5;position:relative;overflow:hidden;background:#000}
.ptr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:8px}
.tile{background:var(--p1);border:1px solid var(--line);border-radius:8px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column}
.tile:hover{border-color:var(--mute)}
.tile .th{position:relative;aspect-ratio:16/9;background:#000;border-bottom:3px solid var(--c)}
.tile .th img{width:100%;height:100%;object-fit:cover}
.tile .du{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.75);padding:2px 6px;border-radius:3px}
.tile .sb{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:2px;opacity:0;transition:opacity .2s}
.tile:hover .sb{opacity:1}
.sb i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}
.sb i.on{background:var(--acc)}
.tile .tb{padding:14px 16px 16px;display:grid;gap:8px}
.tile h3{font-size:30px}
.tile p{margin:0;color:var(--mute);font-size:14px}
/* career timeline */
.ctl{overflow-x:auto}
.ctl .in{min-width:820px;padding:10px 12px 14px;direction:ltr}
.ctl .lane{height:46px;background:none}
.ctl .cl{font-size:12px;flex-direction:column;align-items:flex-start;justify-content:center;gap:0;line-height:1.2}
.ctl .cl small{font-weight:500;opacity:.85}
.ctl .cl.sel{outline:2px solid #fff;outline-offset:-1px}
.ctl .thd{font-size:12px}
.jobs{display:grid;gap:0}
.job{display:grid;grid-template-columns:130px minmax(0,1fr);gap:4px 20px;padding:16px 14px;border-bottom:1px solid var(--line)}
.job:last-child{border-bottom:0}
.job .tc{color:var(--acc);padding-top:4px}
.job h3{font-size:26px}
.job p{margin:4px 0 0;color:var(--mute)}
@media(max-width:560px){.job{grid-template-columns:minmax(0,1fr)}}
.skills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
@media(max-width:900px){.skills{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* project page */
.pv{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:8px}
@media(max-width:980px){.pv{grid-template-columns:minmax(0,1fr)}}
.strip{display:flex;gap:2px;padding:8px 12px 12px;overflow-x:auto;direction:ltr}
.strip button{flex:0 0 auto;width:96px;aspect-ratio:16/9;padding:0;border:2px solid transparent;border-radius:3px;overflow:hidden;cursor:pointer;background:#000}
.strip button.on{border-color:var(--acc)}
.strip img{width:100%;height:100%;object-fit:cover}
.vids{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:8px}
.vid{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#000;border:1px solid var(--line);padding:0;cursor:pointer;color:#fff;text-decoration:none;display:block;width:100%}
.vid img{width:100%;height:100%;object-fit:cover;opacity:.6}
.vid span{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:8px;font-weight:600;font-size:14px}

function startEdit(){
  const mon=document.getElementById('mon'); if(!mon) return;
  const frame=document.getElementById('frame'), pt=document.getElementById('pt'), lower=document.getElementById('lower'), sub=document.getElementById('sub');
  const phd=document.getElementById('phd'), lanes=document.getElementById('lanes'), insp=document.getElementById('insp'), inName=document.getElementById('inName');
  const tc=[1,2,3].map(i=>document.getElementById('tc'+i)), bPlay=document.getElementById('bPlay');
  const lookImgs=[...pt.querySelectorAll('.look img')];
  let tt=0, playing=false, raf=0, last=0, curClip=-1, curFrame='', curMk=-1, vis=true;
  const clipAt=s=>SEQ.findIndex(c=>s>=c.start&&s<c.start+c.dur);
  const inspFor=i=>{const c=SEQ[i];
    if(c.kind==='portrait'){inName.textContent='portrait_oussama.mov';insp.innerHTML=`<h2>Oussama Amentag</h2><p class="sum">Filmmaker, visual designer and creative technologist. For close to a decade I’ve worked behind cameras and inside editing timelines.</p><dl class="kv"><dt>Based in</dt><dd>Agadir, Morocco</dd><dt>Since</dt><dd>2017</dd><dt>Languages</dt><dd>Arabic, French, English</dd><dt>Available</dt><dd>On site & remote</dd></dl><div style="display:flex;flex-wrap:wrap;gap:8px"><a class="btn" href="#about">${t('about')}</a><a class="btn" href="#resume">${t('resume')}</a></div>`;return}
    const p=POSTS.find(x=>x.slug===c.slug);inName.textContent=c.name;
    insp.innerHTML=`<h2>${esc(p.title)}</h2>${chips(p.labels)}<p class="sum">${esc(p.summary)}</p><dl class="kv"><dt>Date</dt><dd>${p.date}</dd><dt>Duration</dt><dd class="tc">${tcode(c.dur)}</dd><dt>Tools</dt><dd>${p.tools.join(', ')}</dd><dt>Media</dt><dd>${p.gallery.length} photos · ${p.videos.length} video${p.videos.length>1?'s':''}</dd></dl><div><a class="btn acc" href="#work-${p.slug}">${t('view')} →</a></div>`};
  const render=()=>{
    const i=Math.max(0,clipAt(tt)), c=SEQ[i];
    if(i!==curClip){curClip=i;inspFor(i);document.querySelectorAll('#pool .clip').forEach((b,j)=>b.classList.toggle('cur',j===i))}
    if(c.kind==='portrait'){pt.hidden=false;frame.hidden=true;lower.hidden=true}
    else{const k=Math.min(c.frames.length-1,Math.floor((tt-c.start)/(c.dur/c.frames.length)));const f=c.frames[k];if(f!==curFrame){curFrame=f;frame.src=f}frame.hidden=false;pt.hidden=true;
      const p=POSTS.find(x=>x.slug===c.slug);const showL=tt-c.start<3;lower.hidden=!showL;if(showL){document.getElementById('lowT').textContent=p.title;document.getElementById('lowS').textContent=p.labels.join(' · ')+' · '+p.date}}
    const m=MARKS.findIndex(x=>tt>=x.at&&tt<x.at+3.2);
    if(m!==curMk){curMk=m;document.querySelectorAll('.mk').forEach((b,j)=>b.classList.toggle('on',j===m));sub.hidden=m<0||(c.kind!=='portrait'&&tt-c.start<3);if(m>=0){sub.innerHTML=`“${esc(MARKS[m].q[2])}”<small>${esc(MARKS[m].q[0])}</small>`}}
    if(m>=0) sub.hidden=(c.kind!=='portrait'&&tt-c.start<3);
    const w=lanes.clientWidth-52; phd.style.left=(52+w*tt/TOTAL)+'px';
    const s=tcode(tt);tc[0].textContent=s;tc[1].textContent=s+' / '+tcode(TOTAL);tc[2].textContent=s;
  };
  const loop=now=>{raf=0;if(!playing||!vis)return;const dt=Math.min(.1,(now-last)/1000);last=now;tt+=dt;if(tt>=TOTAL)tt=0;render();raf=requestAnimationFrame(loop)};
  const play=()=>{playing=true;bPlay.innerHTML=P.pause;bPlay.setAttribute('aria-label','Pause');last=performance.now();if(!raf)raf=requestAnimationFrame(loop)};
  const pause=()=>{playing=false;bPlay.innerHTML=P.play;bPlay.setAttribute('aria-label','Play')};
  const seek=s=>{tt=Math.max(0,Math.min(TOTAL-.001,s));render()};
  const jump=i=>{seek(SEQ[(i+SEQ.length)%SEQ.length].start+.001)};
  on(bPlay,'click',()=>playing?pause():play());
  on(document.getElementById('bPrev'),'click',()=>{const i=clipAt(tt);jump(tt-SEQ[i].start>1?i:i-1)});
  on(document.getElementById('bNext'),'click',()=>jump(clipAt(tt)+1));
  document.querySelectorAll('[data-jump]').forEach(b=>on(b,'click',e=>{e.stopPropagation();jump(+b.dataset.jump)}));
  document.querySelectorAll('.mk').forEach(b=>on(b,'click',e=>{e.stopPropagation();seek(MARKS[+b.dataset.mk].at+.01)}));
  document.querySelectorAll('#pool .clip').forEach(b=>on(b,'dblclick',()=>{const c=SEQ[+b.dataset.jump];location.hash=c.slug?'#work-'+c.slug:'#about'}));
  let drag=false, wasPlaying=false;
  const sx=e=>{const r=lanes.getBoundingClientRect();return (e.clientX-r.left-52)/(r.width-52)*TOTAL};
  on(lanes,'pointerdown',e=>{if(e.target.closest('.mk'))return;drag=true;wasPlaying=playing;pause();lanes.setPointerCapture(e.pointerId);seek(sx(e))});
  on(lanes,'pointermove',e=>{if(drag)seek(sx(e))});
  on(lanes,'pointerup',()=>{if(drag){drag=false;if(wasPlaying)play()}});
  on(document,'keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
    if(e.key===' '||e.key==='k'||e.key==='K'){if(e.key===' '&&e.target.closest('button,a'))return;e.preventDefault();e.key===' '?(playing?pause():play()):pause()}
    else if(e.key==='l'||e.key==='L')play();
    else if(e.key==='j'||e.key==='J'){pause();seek(tt-2)}
    else if(e.key==='ArrowRight'&&document.activeElement===document.body){seek(tt+1/FPS)}
    else if(e.key==='ArrowLeft'&&document.activeElement===document.body){seek(tt-1/FPS)}});
  on(window,'resize',render);
  // eye-follow on the portrait clip
  let cur=-1; const show=(c,r)=>{const i=r*LOOK.cols+c;if(i===cur)return;cur=i;const s=LOOK.frames[i];lookImgs.forEach(m=>m.classList.toggle('on',m.dataset.src===s))};show(1,1);
  if(fine) on(window,'pointermove',e=>{const b=mon.getBoundingClientRect();const dx=Math.max(-1,Math.min(1,(e.clientX-(b.left+b.width*.78))/(innerWidth*.45))),dy=Math.max(-1,Math.min(1,(e.clientY-(b.top+b.height*.35))/(innerHeight*.45)));show(Math.min(2,Math.floor((dx+1)*1.5)),Math.min(2,Math.floor((dy+1)*1.5)))},{passive:true});
  let ri=0;const role=document.getElementById('role');const rt=still?0:setInterval(()=>{ri=(ri+1)%ROLES.length;role.textContent=ROLES[ri]},2600);offs.push(()=>clearInterval(rt));
  const io=new IntersectionObserver(es=>{vis=es[0].isIntersecting;if(vis&&playing){last=performance.now();if(!raf)raf=requestAnimationFrame(loop)}});io.observe(mon);
  offs.push(()=>{io.disconnect();cancelAnimationFrame(raf)});
  document.querySelectorAll('[data-bin]').forEach(b=>on(b,'click',()=>{pendingBin=b.dataset.bin;document.querySelectorAll('[data-bin]').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelectorAll('#pool li').forEach(li=>{li.hidden=pendingBin!=='All'&&!li.dataset.labels.split(' ').includes(pendingBin)})}));
  render(); if(!still) play();
}

V.post=p=>{const i=POSTS.indexOf(p),pr=POSTS[i+1],nx=POSTS[i-1];return `<div class="pg"><div class="pgh"><div><p class="tc" style="margin-bottom:12px"><a href="#works" style="text-decoration:none;color:var(--mute)">${t('works')}</a> / ${esc(p.file)}</p><h1 style="font-size:clamp(48px,7vw,104px)">${esc(p.title)}</h1></div>${chips(p.labels)}</div>
<div class="pv">
  <div class="panel"><div class="ph"><b>Source: ${esc(p.file)}</b><span class="tc" id="ptc">${tcode(0)}</span></div>
    <div class="stage" style="padding:10px;background:#0a0a0b"><div class="mon" style="max-width:100%">${img(p.cover,p.title,1280,720,1)}</div></div>
    <div class="strip" id="pstrip">${p.gallery.map((g,k)=>`<button data-k="${k}" class="${k?'':'on'}" aria-label="Frame ${k+1}">${img(g,'',1100,733)}</button>`).join('')}</div></div>
  <div class="panel"><div class="ph"><b>Inspector</b></div><div class="pb" style="display:grid;gap:14px"><p style="margin:0;font:400 22px/1.3 'Instrument Serif',serif">${esc(p.intro)}</p><dl class="kv"><dt>Date</dt><dd>${p.date}</dd><dt>Tools</dt><dd>${p.tools.join(', ')}</dd><dt>Media</dt><dd>${p.gallery.length} photos · ${p.videos.length} video${p.videos.length>1?'s':''}</dd></dl>${p.cta?`<a class="btn acc" href="#contact">${p.cta}</a>`:`<a class="btn acc" href="#contact">Start a similar project</a>`}</div></div>
</div>
<div class="two" style="margin-top:8px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
  <div class="panel"><div class="ph"><b>The brief</b></div><div class="pb prose"><p style="margin:0">${esc(p.brief)}</p></div></div>
  <div class="panel"><div class="ph"><b>What I did</b></div><div class="pb prose"><p style="margin:0">${esc(p.did)}</p></div></div>
</div>
<div class="panel" style="margin-top:8px"><div class="ph"><b>${p.videos.length>1?'Linked media: video highlights':'Linked media: the film'}</b></div><div class="pb"><div class="vids">${p.videos.map(v=>v.drive?`<button class="vid" data-drive="${v.drive}">${img(v.poster,v.label,1100,733)}<span><i>▶</i>${v.label}</span></button>`:`<a class="vid" href="${v.href}" target="_blank" rel="noopener">${img(v.poster,v.label,1280,720)}<span><i>▶</i>${v.label}</span></a>`).join('')}</div></div></div>
<div class="panel" style="margin-top:8px"><div class="ph"><b>Media: gallery</b><span>${p.gallery.length} photos</span></div><div class="pb"><div class="gal">${p.gallery.map((g,k)=>`<button data-g="${k}" aria-label="Open photo ${k+1}">${img(g,p.title+' photo '+(k+1),1100,733)}</button>`).join('')}</div></div></div>
<div class="pnav">${pr?`<a href="#work-${pr.slug}"><small>← ${t('prev')}</small><b>${esc(pr.title)}</b></a>`:'<span></span>'}${nx?`<a class="nx" href="#work-${nx.slug}"><small>${t('next')} →</small><b>${esc(nx.title)}</b></a>`:''}</div>
</div>${exportBand()}`};
function bindPost(p){
  const mon=document.querySelector('.pv .mon img'),tc=document.getElementById('ptc');
  document.querySelectorAll('#pstrip button').forEach(b=>on(b,'click',()=>{const k=+b.dataset.k;mon.src=p.gallery[k];tc.textContent=tcode(k*3);document.querySelectorAll('#pstrip button').forEach(x=>x.classList.toggle('on',x===b))}));
  document.querySelectorAll('.vid[data-drive]').forEach(b=>on(b,'click',()=>{const url='https://drive.google.com/file/d/'+b.dataset.drive;
    if(CAN_EMBED)b.outerHTML=`<div class="vid"><iframe src="${url}/preview" allow="autoplay; fullscreen" allowfullscreen title="Video"></iframe></div>`;else{const a=document.createElement('a');a.href=url+'/view';a.target='_blank';a.rel='noopener';a.click()}}));
  document.querySelectorAll('[data-g]').forEach(b=>on(b,'click',()=>lightbox(p.gallery,+b.dataset.g,b)));
}
function lightbox(list,k,opener){
  const d=document.createElement('div');d.className='lb';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-label','Photo viewer');
  const show=()=>{d.innerHTML=`<img src="${list[k]}" alt="Photo ${k+1} of ${list.length}"><button class="x" aria-label="Close">✕</button><button class="p" aria-label="Previous photo">‹</button><button class="n" aria-label="Next photo">›</button><div class="cnt tc">${k+1} / ${list.length}</div>`};
  const go=s=>{k=(k+s+list.length)%list.length;show()};
  const close=()=>{d.remove();document.removeEventListener('keydown',key);opener&&opener.focus()};
  const key=e=>{if(e.key==='Escape')close();if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)};
  d.addEventListener('click',e=>{const c=e.target.className;if(c==='x'||e.target===d)close();else if(c==='n')go(1);else if(c==='p')go(-1)});
  document.addEventListener('keydown',key);show();document.body.appendChild(d);d.querySelector('.x').focus();
}

/* ---------- router ---------- */
function render(){
  offs.forEach(f=>f());offs=[];
  const h=(location.hash||'#home').slice(1);
  const post=h.startsWith('work-')&&POSTS.find(p=>'work-'+p.slug===h);
  const view=post?'post':(V[h]?h:'home');
  app.innerHTML=post?V.post(post):V[view]();
  document.querySelectorAll('nav.tabs a').forEach(a=>a.getAttribute('href')==='#'+(post?'works':view)?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  document.title=post?post.title+' · Oussama Amentag':view==='home'?'Oussama Amentag — Filmmaker & Creative Technologist':t(view)+' · Oussama Amentag';
  if(view==='home')startEdit();
  if(view==='works')bindWorks();
  if(view==='resume')bindResume();
  if(view==='contact')bindContact();
  if(post)bindPost(post);
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const g=e.target.closest('[data-bin-go]');if(g)pendingBin=g.dataset.binGo});
document.getElementById('foot').innerHTML=`<a href="mailto:${EMAIL}">${EMAIL}</a><a href="tel:${TEL}">${PHONE}</a><a href="${LINKEDIN}" target="_blank" rel="noopener">LinkedIn</a><a href="${WA}" target="_blank" rel="noopener">WhatsApp</a>`;
function setLang(l){lang=l;root.lang=l;root.dir=l==='ar'?'rtl':'ltr';document.getElementById('lang').textContent=l.toUpperCase();document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));try{localStorage.setItem('oa-lang',l)}catch(e){}render()}
document.getElementById('lang').addEventListener('click',()=>setLang({en:'fr',fr:'ar',ar:'en'}[lang]));
window.addEventListener('hashchange',render);
setLang(lang);
}
</script>
