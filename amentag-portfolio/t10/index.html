<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio Template T10</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Oussama Amentag — filmmaker, video mapping artist, designer and app developer based in Agadir, Morocco.">
<meta name="theme-color" content="#ebe7e0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&family=Inter:wght@400;500;600&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE occasion: a sunlit Agadir day, bright, confident, playful in motion
   IDEA a camera lens on the Souss coast: an iris opens on the site, the portrait sits in a round lens, the day moves from sand to ocean to sunset as you scroll
   PICTURE the hero lens: the portrait in a circle ringed by rotating role text, with the name in huge wide letters across the screen
   COLOUR sand #f1e9dc, ink #15130f, ocean var(--ocean) and deep ocean var(--deep), sunset var(--sun) as the one spark
   TYPE Syne 800 (wide display) + Inter; Cairo for Arabic
   LAYOUT laptop: name across the full width, lens centred over it, intro and buttons below in three columns; phone: name, lens, text, buttons
   MOTION breathing name letters, curved wall of frames, drawn process line, 3D screening room contact, iris intro, rack focus, zoom through the lens on scroll, loupe over photos, decoding menu, rotating ring, velocity marquee, stacking cards, colour-shifting background, scroll reveals */
:root{--g:max(5vw,16px);--bg:var(--sand);--fg:var(--ink);--line:color-mix(in srgb,var(--ink) 14%,transparent);--cardmute:color-mix(in srgb,var(--ink) 62%,var(--paper))}
/* palettes: bone & clay (default), atlantic, desert gold, ink & cobalt */
:root,:root[data-pal=clay]{--sand:#ebe7e0;--paper:#f6f4f0;--ink:#121110;--mute:#6a655e;--ocean:#2b2926;--deep:#161514;--deepfg:#efece6;--deepmute:#a39d94;--sun:#c2553a;--onacc:#fff;--onaccmute:rgba(255,255,255,.8);--sunbg:#161514;--sunfg:#efece6;--sunmute:#a39d94;--sunhl:#c2553a}
:root[data-pal=atlantic]{--sand:#e9eeec;--paper:#f6f8f7;--ink:#0d1a1f;--mute:#59676b;--ocean:#1d4653;--deep:#0b1d24;--deepfg:#e8f0ee;--deepmute:#93a8ab;--sun:#2a8f83;--onacc:#fff;--onaccmute:rgba(255,255,255,.82);--sunbg:#0b1d24;--sunfg:#e8f0ee;--sunmute:#93a8ab;--sunhl:#5cc3b5}
:root[data-pal=gold]{--sand:#efe8dc;--paper:#f8f4ec;--ink:#1c1813;--mute:#6c6356;--ocean:#3a3126;--deep:#1c1813;--deepfg:#f3ece0;--deepmute:#ab9f8c;--sun:#b0812a;--onacc:#1c1813;--onaccmute:rgba(28,24,19,.78);--sunbg:#b0812a;--sunfg:#1c1813;--sunmute:#4a3a1e;--sunhl:#f8f4ec}
:root[data-pal=cobalt]{--sand:#f1f1ef;--paper:#fafaf9;--ink:#0b0b0c;--mute:#606066;--ocean:#1b1b20;--deep:#0b0b0c;--deepfg:#f1f1ef;--deepmute:#9a9aa2;--sun:#2c4bf0;--onacc:#fff;--onaccmute:rgba(255,255,255,.82);--sunbg:#2c4bf0;--sunfg:#fff;--sunmute:rgba(255,255,255,.78);--sunhl:#fff}
*{box-sizing:border-box;min-width:0}
html{background:var(--sand)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 Inter,"Cairo",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased;transition:background-color .7s ease,color .7s ease}
html[dir=rtl] body{font-family:"Cairo",Inter,system-ui,sans-serif}
body[data-tone=ocean]{--bg:var(--deep);--fg:var(--deepfg);--mute:var(--deepmute);--line:color-mix(in srgb,var(--deepfg) 16%,transparent)}
body[data-tone=sun]{--bg:var(--sunbg);--fg:var(--sunfg);--mute:var(--sunmute);--line:color-mix(in srgb,var(--sunfg) 22%,transparent)}
body[data-tone=sun] .cta h2{color:var(--fg)}
body[data-tone=sun] .mail{color:var(--sunhl)}
body[data-tone=paper]{--bg:var(--paper)}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
h1,h2,h3{font-family:Syne,"Cairo",sans-serif;font-weight:800;line-height:.95;letter-spacing:-.03em;margin:0}
h2{font-size:clamp(34px,5.4vw,84px)}
h3{font-size:clamp(24px,2.4vw,34px);letter-spacing:-.02em}
p{margin:0 0 1em}
.wrap{max-width:1300px;margin:0 auto}
.band{padding-block:clamp(64px,9vw,140px);padding-left:max(var(--g),env(safe-area-inset-left,0px));padding-right:max(var(--g),env(safe-area-inset-right,0px))}
.lead{font-size:clamp(18px,1.6vw,21px);color:var(--mute);max-width:56ch}
.mute{color:var(--mute)}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:54px;padding:0 26px;border-radius:999px;font:600 15px Inter,sans-serif;text-decoration:none;border:1.5px solid var(--fg);background:none;color:var(--fg);cursor:pointer;transition:background .25s,color .25s,transform .25s}
.btn:hover{background:var(--fg);color:var(--bg)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--onacc)}
.btn.sun:hover{background:var(--ink);border-color:var(--ink);color:var(--sand)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--sand)}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;font-weight:500;padding:4px 12px;border-radius:999px;border:1px solid var(--line);text-decoration:none}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-bottom:-.08em}
.wi{display:inline-block}
/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:30;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
body.hh header{transform:translateY(-120%)}
.bar{display:flex;align-items:center;gap:16px;margin:12px max(var(--g),env(safe-area-inset-left,0px)) 0;padding:8px 8px 8px 20px;border-radius:999px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);max-width:1300px}
@media(min-width:1440px){.bar{margin-inline:auto}}
.brand{font:800 18px Syne,sans-serif;text-decoration:none;letter-spacing:-.02em;white-space:nowrap}
nav.main{display:flex;gap:2px;margin-inline-start:auto}
nav.main a{padding:9px 14px;border-radius:999px;text-decoration:none;font-size:14.5px;font-weight:500}
nav.main a:hover{background:var(--line)}
nav.main a[aria-current=page]{background:var(--fg);color:var(--bg)}
.ib{height:40px;min-width:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--fg);font:600 13px Inter,sans-serif;cursor:pointer}
#menu{display:none}
@media(max-width:900px){nav.main{position:fixed;left:12px;right:12px;top:calc(76px + env(safe-area-inset-top,0px));flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:24px;padding:12px;display:none}nav.main.open{display:flex}nav.main a{font:800 28px Syne,sans-serif;padding:10px 14px}#menu{display:block}.tools{margin-inline-start:auto}}
.tools{display:flex;gap:6px}
/* iris intro */
.iris{position:fixed;inset:0;z-index:95;pointer-events:auto;animation:irisSafe .5s 4.5s forwards}
@keyframes irisSafe{to{opacity:0;visibility:hidden}}
.iris.js{animation:none}
.iris svg{width:100%;height:100%;display:block}
.iris .meta{position:absolute;left:var(--g);right:var(--g);bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;color:#d8cfc1;font:600 13px Inter,sans-serif;letter-spacing:.04em}
.iris .meta b{font:800 clamp(28px,4vw,48px)/1 Syne,sans-serif;color:var(--sand);font-variant-numeric:tabular-nums}
/* hero */
.hero{position:relative;min-height:100svh;display:grid;align-content:center;padding-top:calc(96px + env(safe-area-inset-top,0px));padding-bottom:40px;overflow:hidden}
.hname{font:800 clamp(40px,10.4vw,184px)/.84 Syne,"Cairo",sans-serif;letter-spacing:-.05em;text-transform:uppercase;white-space:nowrap;text-align:center;margin:0}
.hname span{display:block}
.lens{position:relative;width:clamp(220px,24vw,340px);aspect-ratio:1;margin:calc(-1*clamp(40px,6vw,100px)) auto;z-index:2}
.lens::before{content:"";position:absolute;inset:-2%;border-radius:50%;background:var(--bg);transition:background-color .7s}
.lens .glass{position:absolute;inset:14%;border-radius:50%;overflow:hidden;background:#1d1a16;box-shadow:0 30px 60px -20px rgba(21,19,15,.5),inset 0 0 0 6px var(--ink)}
.lens .glass img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%;opacity:0;transform:scale(1.25)}
.lens .glass img.on{opacity:1}
.lens .glare{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.35),transparent 35%);pointer-events:none}
.ring{position:absolute;inset:0;animation:spin 22s linear infinite}
.ring text{font:700 12.5px Inter,sans-serif;letter-spacing:.28em;fill:var(--fg);text-transform:uppercase}
@keyframes spin{to{transform:rotate(360deg)}}
.hbot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 40px;align-items:end;max-width:1300px;margin:clamp(36px,5vw,56px) auto 0;width:100%}
.hbot .lead{margin:0;font-size:17px}
.hbot .ctas{justify-self:center}
.clock{justify-self:end;text-align:end;font-size:14px;color:var(--mute)}
.clock b{display:block;font:800 clamp(28px,3vw,40px)/1 Syne,sans-serif;color:var(--fg);font-variant-numeric:tabular-nums}
.ctas{display:flex;flex-wrap:wrap;gap:10px}
.avail{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;margin-bottom:12px}
.avail i{width:9px;height:9px;border-radius:50%;background:#1fa35a;box-shadow:0 0 0 4px rgba(31,163,90,.2)}
@media(max-width:900px){.hname{font-size:10.8vw}.lens{margin:-14px auto;width:min(66vw,290px)}.hbot{grid-template-columns:minmax(0,1fr)}.hbot .ctas,.clock{justify-self:start;text-align:start}}
/* marquee */
.mq{overflow:hidden;padding-block:clamp(24px,3vw,40px);border-block:1px solid var(--line)}
.mqt{display:flex;width:max-content;will-change:transform}
.mqt span{font:800 clamp(48px,8vw,136px)/1 Syne,sans-serif;letter-spacing:-.04em;text-transform:uppercase;padding-inline:.25em;white-space:nowrap;display:flex;align-items:center;gap:.25em}
.mqt span::after{content:"";width:.32em;height:.32em;border-radius:50%;background:var(--sun);flex:none}
.mqt span:nth-child(even){color:transparent;-webkit-text-stroke:2px var(--fg)}
/* statement */
.state{font:800 clamp(26px,3.6vw,54px)/1.1 Syne,"Cairo",sans-serif;letter-spacing:-.03em;max-width:22ch}
.state em{font-style:normal;color:var(--sun)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin-top:clamp(40px,5vw,72px)}
.facts div{border-top:2px solid var(--fg);padding-top:14px}
.facts small{display:block;color:var(--mute);font-size:13.5px}
.facts b{font-weight:600;font-size:17px}
@media(max-width:800px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* services accordion */
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:20px 40px;margin-bottom:clamp(28px,4vw,56px)}
.head .lead{margin:0}
.svc{border-top:1px solid var(--line)}
.svc details{border-bottom:1px solid var(--line)}
.svc summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:70px minmax(0,1fr) auto;align-items:center;gap:16px;padding:clamp(18px,2.4vw,30px) 0}
.svc summary::-webkit-details-marker{display:none}
.svc summary .n{font:600 14px Inter,sans-serif;color:var(--mute);font-variant-numeric:tabular-nums}
.svc summary h3{font-size:clamp(26px,3.8vw,58px);transition:transform .45s cubic-bezier(.2,.7,.2,1),color .3s}
.svc summary:hover h3{transform:translateX(14px);color:var(--sun)}
html[dir=rtl] .svc summary:hover h3{transform:translateX(-14px)}
.svc .pm{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--fg);display:grid;place-items:center;font-size:24px;transition:transform .35s,background .3s,color .3s}
.svc details[open] .pm{transform:rotate(45deg);background:var(--fg);color:var(--bg)}
.svc .body{display:grid;grid-template-columns:70px minmax(0,1fr) minmax(0,1fr);gap:16px;padding:0 0 30px}
.svc .body p{grid-column:2;margin:0;font-size:18px;max-width:46ch}
.svc .body .tags{grid-column:3;align-content:start}
@media(max-width:800px){.svc summary{grid-template-columns:40px minmax(0,1fr) auto}.svc .body{grid-template-columns:40px minmax(0,1fr)}.svc .body .tags{grid-column:2}}
.peek{position:fixed;left:0;top:0;width:300px;aspect-ratio:4/3;border-radius:18px;overflow:hidden;pointer-events:none;z-index:25;opacity:0;transform:scale(.8);transition:opacity .25s,scale .25s}
.peek.on{opacity:1}
.peek img{width:100%;height:100%;object-fit:cover}
/* stacking work cards */
.stack{display:grid;gap:24px}
.card{position:sticky;top:calc(100px + var(--i)*18px);display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:center;background:var(--paper);color:var(--ink);border-radius:32px;padding:clamp(16px,2vw,24px);min-height:min(76svh,640px);text-decoration:none;transform-origin:center top;box-shadow:0 -1px 0 rgba(255,255,255,.4)}
.card .im{height:100%;min-height:300px;border-radius:20px;overflow:hidden;position:relative}
.card .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.card:hover .im img{transform:scale(1.05)}
.card .tx{padding:clamp(4px,2vw,24px)}
.card .no{font:800 15px Syne,sans-serif;color:var(--sun)}
.card h3{font-size:clamp(30px,3.6vw,54px);margin:14px 0 18px;letter-spacing:-.035em}
.card p{color:var(--cardmute);font-size:17px}
.card .tag{border-color:rgba(21,19,15,.18)}
.go{display:inline-flex;align-items:center;gap:12px;margin-top:22px;font-weight:600}
.go i{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--sand);display:grid;place-items:center;font-style:normal;transition:transform .3s,background .3s}
.card:hover .go i{transform:rotate(-45deg);background:var(--sun);color:var(--ink)}
.card.next{background:var(--sun);color:var(--onacc);grid-template-columns:minmax(0,1fr)}
.card.next .go i{background:var(--onacc);color:var(--sun)}
.card.next h3{font-size:clamp(36px,5.6vw,92px)}
@media(max-width:820px){.card{grid-template-columns:minmax(0,1fr);min-height:0;top:calc(84px + var(--i)*12px)}.card .im{min-height:0;aspect-ratio:16/11;height:auto}}
/* testimonials drag row */
.drag{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:16px;cursor:grab;scrollbar-width:none;margin-inline:calc(-1*var(--g));padding-inline:var(--g)}
.drag::-webkit-scrollbar{display:none}
.drag.down{cursor:grabbing;scroll-snap-type:none}
.q{flex:0 0 min(440px,84vw);scroll-snap-align:start;background:var(--paper);color:var(--ink);border-radius:28px;padding:clamp(24px,3vw,36px);display:flex;flex-direction:column;gap:22px;margin:0;user-select:none}
.q:nth-child(3n+2){background:var(--ocean);color:var(--deepfg)}
.q:nth-child(3n){background:var(--ink);color:var(--sand)}
.q blockquote{margin:0;font:600 clamp(19px,1.7vw,23px)/1.4 Inter,sans-serif;letter-spacing:-.01em}
.q figcaption{margin-top:auto;display:flex;gap:12px;align-items:center;font-size:14px;opacity:.85}
.q figcaption b{display:block;font-size:15px;opacity:1}
.q .av{width:44px;height:44px;border-radius:50%;background:var(--sun);color:var(--ink);display:grid;place-items:center;font:800 14px Syne,sans-serif;flex:none}
.hint{font-size:14px;color:var(--mute);display:flex;align-items:center;gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(10em,1fr));gap:24px;margin-top:clamp(48px,6vw,88px)}
.stats b{display:block;font:800 clamp(60px,8vw,120px)/1 Syne,sans-serif;letter-spacing:-.05em}
.stats span{color:var(--mute)}
.logos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.logo{height:92px;border-radius:20px;background:#fff;display:grid;place-items:center;padding:14px 18px;transition:transform .3s}
.logo:hover{transform:translateY(-4px)}
.logo img{max-height:56px;width:auto;max-width:120px;object-fit:contain;filter:grayscale(1);opacity:.75;transition:filter .3s,opacity .3s}
.logo img.k{filter:brightness(0);opacity:.7}
.logo:hover img{filter:none;opacity:1}
/* cta */
.cta h2{font-size:clamp(40px,9.4vw,168px);line-height:.84;letter-spacing:-.055em;text-transform:uppercase}
.ctab{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px 48px;align-items:end;margin-top:clamp(32px,4vw,56px)}
@media(max-width:820px){.ctab{grid-template-columns:minmax(0,1fr)}}
.mail{font:600 clamp(22px,2.8vw,40px)/1.15 Inter,sans-serif;letter-spacing:-.02em;text-decoration:none;border-bottom:3px solid currentColor;overflow-wrap:anywhere}
.copied{font-size:14px;margin-inline-start:6px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 28px;font-size:14px;color:var(--mute)}
footer nav{display:flex;flex-wrap:wrap;gap:6px 20px}
footer a{text-decoration:none}
footer a:hover{color:var(--fg)}
.wa{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--ink);display:grid;place-items:center;z-index:20;box-shadow:0 10px 24px rgba(0,0,0,.18)}
.wa svg{width:28px;height:28px;fill:#fff}
html[dir=rtl] .wa{right:auto;left:calc(18px + env(safe-area-inset-left,0px))}
/* inner pages */
.ph{padding-top:calc(150px + env(safe-area-inset-top,0px));padding-bottom:clamp(32px,4vw,56px)}
.ph h1{font-size:clamp(40px,8.2vw,148px);line-height:.85;letter-spacing:-.05em;text-transform:uppercase}
.ph .lead{margin-top:clamp(20px,2.4vw,32px)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:clamp(32px,6vw,88px);align-items:start}
@media(max-width:860px){.split{grid-template-columns:minmax(0,1fr)}}
.sticky{position:sticky;top:calc(110px + env(safe-area-inset-top,0px))}
.round{aspect-ratio:1;border-radius:50%;overflow:hidden;max-width:420px}
.round img{width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.prose{max-width:64ch;font-size:17.5px}
.prose h2{font-size:clamp(32px,3.6vw,48px);margin:56px 0 16px}
.prose h2:first-child{margin-top:0}
.prose ul{padding:0;margin:0;list-style:none;display:grid;gap:14px}
.prose li{padding-inline-start:26px;position:relative}
.prose li::before{content:"";position:absolute;inset-inline-start:0;top:.55em;width:12px;height:12px;border-radius:50%;background:var(--sun)}
.pills{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0}
.pills li{padding:7px 15px;border-radius:999px;background:var(--fg);color:var(--bg);font-size:14px;font-weight:500}
.prose .pills li{padding-inline-start:15px}.prose .pills li::before{display:none}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:24px}
.kv small{display:block;color:var(--mute);font-size:13px}
.kv b{font-weight:600}
/* works grid */
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{min-height:44px;padding:0 20px;border-radius:999px;border:1.5px solid var(--fg);background:none;color:var(--fg);font:600 14.5px Inter,sans-serif;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:24px}
.tile{display:block;text-decoration:none;border-radius:28px;background:var(--paper);color:var(--ink);padding:14px;transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.tile:hover{transform:translateY(-6px) rotate(-.6deg)}
.tile .im{aspect-ratio:4/3;border-radius:18px;overflow:hidden}
.tile .im img{width:100%;height:100%;object-fit:cover}
.tile .tx{padding:18px 8px 8px}
.tile h3{font-size:clamp(28px,2.6vw,38px);margin:8px 0 10px}
.tile p{color:var(--cardmute);margin-bottom:14px}
/* resume line */
.tl{position:relative;padding-inline-start:clamp(36px,6vw,80px)}

V.about=()=>`
<section class="band ph" data-tone="sand"><div class="wrap"><h1>${t('about')}</h1><p class="lead">Oussama Amentag — a filmmaker, visual designer and creative technologist based in Agadir, Morocco.</p></div></section>
<section class="band" data-tone="sand" style="padding-top:0"><div class="wrap split">

  <div class="prose">
    <p class="state" style="font-size:clamp(26px,2.8vw,40px)">For close to a decade I’ve worked behind cameras and inside editing timelines.</p>
    <p>From my first on-site editing job to leading editing and graphics for production studios. Today I move between telling stories on screen and building the visuals and tools that carry them.</p>
    <h2>What I do</h2><ul>${DISC.map(d=>`<li><b>${d[0]}</b> — ${d[1]}</li>`).join('')}</ul>
    <h2>How I work</h2><p>Filmmaking taught me story, rhythm and emotion. Building software taught me systems and precision. The work I’m proudest of needs both.</p><p>A mapping show has to run flawlessly on a schedule in front of a live audience. An app has to feel as considered as it functions. A film has to hold someone’s attention in the first five seconds. Different crafts, same discipline — understand the constraint, then make something that feels effortless inside it.</p>
    <h2>Who I work with</h2><p>I’ve collaborated with production houses, agencies and public institutions — among them Lumazic, Soufiane Production, Digital Photo Tafraout, Montrichard Group, the city of Agadir and the province of Sidi Ifni — on work ranging from cultural events and weddings to campaigns for international watch brands.</p>
    <h2>Tools I work in</h2><ul class="pills">${['Premiere Pro','After Effects','DaVinci Resolve','Photoshop','Illustrator','Blender','Resolume','Flutter','FastAPI','AI tools'].map(x=>`<li>${x}</li>`).join('')}</ul>

    <h2>Currently</h2><p>Freelancing from Agadir and taking on new projects — a story to film, a space to light up, or an app to build.</p>
    <div class="ctas" style="margin-top:28px"><a class="btn sun" href="#contact">Get in touch</a><a class="btn" href="#resume">See my full resume</a></div>
  </div>
</div></section>${ctaBand()}`;

    const f=[16,11,8,5.6,4,2.8,2,1.4][Math.min(7,Math.floor(o.r/90))];fs.textContent=f};
  draw();
  const tl=G.timeline({onComplete:finish});
  tl.to(o,{r:60,a:.4,duration:.9,ease:'power2.out',onUpdate:draw})
    .to(o,{r:110,a:.7,duration:.5,ease:'power2.inOut',onUpdate:draw},'+=.25')
    .to(o,{r:900,a:1.6,duration:1.1,ease:'power3.in',onUpdate:draw},'+=.2')
    .to('.iris .meta',{opacity:0,duration:.3},'-=0.7')
    .add(()=>{introDone=true;if(window.__heroTl){window.__heroTl.play();window.__heroTl=null}},'-=0.35');
  iris.addEventListener('click',()=>tl.progress(1));
 }}
